<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pet_profile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Agatha</title>
  <link rel="manifest" href="manifest.json">

  <!-- POSTHOG_WEB_BEGIN -->
  <!-- Replaced at build time by scripts/inject_posthog_web.sh when POSTHOG_API_KEY is set. -->
  <!-- POSTHOG_WEB_END -->

  <style>
    /*
      Native HTML login form embedded in the Flutter landing card on web.
      Real DOM fields let password-manager extensions (Proton Pass, Bitwarden,
      1Password, etc.) detect and autofill credentials — something Flutter's
      canvas-rendered text fields cannot reliably expose. Dart performs auth;
      this form only sources credentials.
    */
    #agatha-native-login-host { display: none; }
    #agatha-native-login {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #agatha-native-login * { box-sizing: border-box; }
    #agatha-native-login label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #49454F;
      margin: 0 0 6px;
    }
    #agatha-native-login .anl-password-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    #agatha-native-login .anl-password-wrap input {
      margin-bottom: 0;
      padding-right: 44px;
    }
    #agatha-native-login .anl-password-toggle {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: #49454F;
    }
    #agatha-native-login .anl-password-toggle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    #agatha-native-login label + input { margin-bottom: 16px; }
    #agatha-native-login .anl-password-wrap label + input { margin-bottom: 0; }
    #agatha-native-login input {
      display: block;
      width: 100%;
      padding: 16px 14px;
      font-size: 16px;
      border: 1px solid #79747E;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s ease;
      color: #1c1b1f;
      background: #fff;
    }
    #agatha-native-login input:focus {
      border-color: #755B68;
      border-width: 2px;
      padding: 15px 13px;
    }
    #agatha-native-login input:disabled { opacity: 0.6; }
    #agatha-native-login .anl-forgot-row {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0 8px;
    }
    #agatha-native-login .anl-error {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #fce9e9;
      color: #b3261e;
      border-radius: 8px;
      font-size: 13px;
    }
    #agatha-native-login .anl-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #755B68;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #agatha-native-login .anl-submit:hover { background: #664C59; }
    #agatha-native-login .anl-submit:disabled { opacity: 0.6; cursor: default; }
    #agatha-native-login .anl-link {
      background: none;
      border: none;
      padding: 4px;
      font-size: 13px;
      color: #755B68;
      cursor: pointer;
    }
    #agatha-native-login .anl-link:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      #agatha-native-login label { color: #cac4d0; }
      #agatha-native-login input {
        background: #2a2730;
        color: #ece6f0;
        border-color: #938f99;
      }
      #agatha-native-login .anl-link { color: #E7DCE2; }
    }
  </style>
</head>
<body>
  <div id="agatha-native-login-host">
    <div id="agatha-native-login">
      <form id="anl-form" autocomplete="on" novalidate>
        <label id="anl-email-label" for="anl-email">Email</label>
        <input id="anl-email" name="username" type="email"
               autocomplete="username" autocapitalize="none" spellcheck="false"
               inputmode="email" required>
        <div class="anl-password-wrap">
          <label id="anl-password-label" for="anl-password">Password</label>
          <input id="anl-password" name="password" type="password"
                 autocomplete="current-password" required>
          <button id="anl-password-toggle" class="anl-password-toggle" type="button"
                  aria-label="Show password" aria-pressed="false">
            <svg class="anl-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
            <svg class="anl-eye-on" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
        <div class="anl-forgot-row">
          <button id="anl-forgot" class="anl-link" type="button">Forgot Password?</button>
        </div>
        <div id="anl-error" class="anl-error" role="alert"></div>
        <button id="anl-submit" class="anl-submit" type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var host = document.getElementById('agatha-native-login-host');
      var root = document.getElementById('agatha-native-login');
      var form = document.getElementById('anl-form');
      var emailInput = document.getElementById('anl-email');
      var pwInput = document.getElementById('anl-password');
      var emailLabel = document.getElementById('anl-email-label');
      var pwLabel = document.getElementById('anl-password-label');
      var submitBtn = document.getElementById('anl-submit');
      var forgotBtn = document.getElementById('anl-forgot');
      var errorEl = document.getElementById('anl-error');
      var pwToggleBtn = document.getElementById('anl-password-toggle');

      function setPasswordVisible(visible) {
        pwInput.type = visible ? 'text' : 'password';
        if (pwToggleBtn) {
          var eyeOn = pwToggleBtn.querySelector('.anl-eye-on');
          var eyeOff = pwToggleBtn.querySelector('.anl-eye-off');
          if (eyeOn) eyeOn.style.display = visible ? 'block' : 'none';
          if (eyeOff) eyeOff.style.display = visible ? 'none' : 'block';
          pwToggleBtn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
          pwToggleBtn.setAttribute('aria-pressed', visible ? 'true' : 'false');
        }
      }

      if (pwToggleBtn) {
        pwToggleBtn.addEventListener('click', function () {
          setPasswordVisible(pwInput.type === 'password');
        });
      }

      var ctrl = {
        onSubmit: null,
        onForgot: null,
        configure: function (emailText, passwordText, signInText, forgotText) {
          emailLabel.textContent = emailText || 'Email';
          pwLabel.textContent = passwordText || 'Password';
          submitBtn.textContent = signInText || 'Sign In';
          forgotBtn.textContent = forgotText || 'Forgot Password?';
        },
        attach: function () {
          this.setError('');
          this.setBusy(false);
        },
        detach: function () {
          if (host && root && root.parentElement !== host) {
            host.appendChild(root);
          }
          this.setBusy(false);
          emailInput.value = '';
          pwInput.value = '';
          setPasswordVisible(false);
          this.setError('');
          this.onSubmit = null;
          this.onForgot = null;
        },
        setError: function (msg) {
          if (msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
          } else {
            errorEl.textContent = '';
            errorEl.style.display = 'none';
          }
        },
        setBusy: function (busy) {
          submitBtn.disabled = !!busy;
          emailInput.disabled = !!busy;
          pwInput.disabled = !!busy;
        }
      };

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = (emailInput.value || '').trim();
        var pw = pwInput.value || '';
        if (!email || !pw) {
          ctrl.setError(' ');
          return;
        }
        ctrl.setError('');
        ctrl.setBusy(true);
        if (typeof ctrl.onSubmit === 'function') {
          ctrl.onSubmit(email, pw);
        }
      });

      forgotBtn.addEventListener('click', function () {
        if (typeof ctrl.onForgot === 'function') { ctrl.onForgot(); }
      });

      window.agathaNativeLogin = ctrl;
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
