  <script>
    (function () {
      var host = document.getElementById('agatha-native-login-host');
      var root = document.getElementById('agatha-native-login');
      var form = document.getElementById('anl-form');
      var emailInput = document.getElementById('anl-email');
      var pwInput = document.getElementById('anl-password');
      var emailLabel = document.getElementById('anl-email-label');
      var pwLabel = document.getElementById('anl-password-label');
      var submitBtn = document.getElementById('anl-submit');
      var forgotBtn = document.getElementById('anl-forgot');
      var errorEl = document.getElementById('anl-error');

      var ctrl = {
        onSubmit: null,
        onForgot: null,
        configure: function (emailText, passwordText, signInText, forgotText) {
          emailLabel.textContent = emailText || 'Email';
          pwLabel.textContent = passwordText || 'Password';
          submitBtn.textContent = signInText || 'Sign In';
          forgotBtn.textContent = forgotText || 'Forgot Password?';
        },
        attach: function () {
          this.setError('');
          this.setBusy(false);
        },
        detach: function () {
          if (host && root && root.parentElement !== host) {
            host.appendChild(root);
          }
          this.setBusy(false);
          emailInput.value = '';
          pwInput.value = '';
          this.setError('');
          this.onSubmit = null;
          this.onForgot = null;
        },
        setError: function (msg) {
          if (msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
          } else {
            errorEl.textContent = '';
            errorEl.style.display = 'none';
          }
        },
        setBusy: function (busy) {
          submitBtn.disabled = !!busy;
          emailInput.disabled = !!busy;
          pwInput.disabled = !!busy;
        }
      };

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = (emailInput.value || '').trim();
        var pw = pwInput.value || '';
        if (!email || !pw) {
          ctrl.setError(' ');
          return;
        }
        ctrl.setError('');
        ctrl.setBusy(true);
        if (typeof ctrl.onSubmit === 'function') {
          ctrl.onSubmit(email, pw);
        }
      });

      forgotBtn.addEventListener('click', function () {
        if (typeof ctrl.onForgot === 'function') { ctrl.onForgot(); }
      });

      window.agathaNativeLogin = ctrl;
    })();
  </script>
