  <title>Agatha</title>

  <style>
    /*
      Native HTML login overlay. This exists as real DOM form fields so that
      browser password-manager extensions (Proton Pass, Bitwarden, 1Password,
      etc.) can detect and autofill them — something Flutter's canvas-rendered
      text fields cannot reliably expose. Credentials are handed back to the
      Flutter app, which performs the actual authentication.
    */
    #agatha-native-login {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      align-items: center;
      justify-content: center;
      background: rgba(28, 24, 40, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    #agatha-native-login * { box-sizing: border-box; }
    #agatha-native-login .anl-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
    }
    #agatha-native-login .anl-logo {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      margin: 0 auto 12px;
    }
    #agatha-native-login .anl-title {
      margin: 0 0 4px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #6750A4;
    }
    #agatha-native-login .anl-subtitle {
      margin: 0 0 20px;
      text-align: center;
      font-size: 13px;
      color: #6b6776;
    }
    #agatha-native-login label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #49454F;
      margin: 14px 0 6px;
    }
    #agatha-native-login input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #cac4d0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease;
      color: #1c1b1f;
      background: #fff;
    }
    #agatha-native-login input:focus { border-color: #6750A4; }
    #agatha-native-login .anl-error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: #fce9e9;
      color: #b3261e;
      border-radius: 8px;
      font-size: 13px;
    }
    #agatha-native-login .anl-submit {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #6750A4;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #agatha-native-login .anl-submit:hover { background: #58459a; }
    #agatha-native-login .anl-submit:disabled { opacity: 0.6; cursor: default; }
    #agatha-native-login .anl-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    #agatha-native-login .anl-link {
      background: none;
      border: none;
      padding: 4px;
      font-size: 13px;
      color: #6750A4;
      cursor: pointer;
    }
    #agatha-native-login .anl-link:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      #agatha-native-login .anl-card { background: #1e1b24; }
      #agatha-native-login .anl-title { color: #cfbcff; }
      #agatha-native-login .anl-subtitle { color: #a9a4b3; }
      #agatha-native-login label { color: #cac4d0; }
      #agatha-native-login input { background: #2a2730; color: #ece6f0; border-color: #49454f; }
      #agatha-native-login .anl-link { color: #cfbcff; }
    }
  </style>
</head>
<body>
  <div id="agatha-native-login" role="dialog" aria-modal="true" aria-labelledby="anl-title">
    <div class="anl-card">
      <img id="anl-logo" class="anl-logo" src="assets/assets/logo.jpg" alt=""
           onerror="this.style.display='none'">
      <h1 id="anl-title" class="anl-title">Agatha Track</h1>
      <p id="anl-subtitle" class="anl-subtitle"></p>
      <form id="anl-form" autocomplete="on" novalidate>
        <label id="anl-email-label" for="anl-email">Email</label>
        <input id="anl-email" name="username" type="email"
               autocomplete="username" autocapitalize="none" spellcheck="false"
               inputmode="email" required>
        <label id="anl-password-label" for="anl-password">Password</label>
        <input id="anl-password" name="password" type="password"
               autocomplete="current-password" required>
        <div id="anl-error" class="anl-error" role="alert"></div>
        <button id="anl-submit" class="anl-submit" type="submit">Sign In</button>
        <div class="anl-links">
          <button id="anl-forgot" class="anl-link" type="button">Forgot Password?</button>
          <button id="anl-dismiss" class="anl-link" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('agatha-native-login');
      var form = document.getElementById('anl-form');
      var emailInput = document.getElementById('anl-email');
      var pwInput = document.getElementById('anl-password');
      var emailLabel = document.getElementById('anl-email-label');
      var pwLabel = document.getElementById('anl-password-label');
      var titleEl = document.getElementById('anl-title');
      var subtitleEl = document.getElementById('anl-subtitle');
      var submitBtn = document.getElementById('anl-submit');
      var forgotBtn = document.getElementById('anl-forgot');
      var dismissBtn = document.getElementById('anl-dismiss');
      var errorEl = document.getElementById('anl-error');

      var ctrl = {
        onSubmit: null,
        onForgot: null,
        onDismiss: null,
        show: function (email, title, subtitle, emailText, passwordText, signInText, forgotText, dismissText) {
          titleEl.textContent = title || 'Sign In';
          subtitleEl.textContent = subtitle || '';
          subtitleEl.style.display = subtitle ? 'block' : 'none';
          emailLabel.textContent = emailText || 'Email';
          pwLabel.textContent = passwordText || 'Password';
          submitBtn.textContent = signInText || 'Sign In';
          forgotBtn.textContent = forgotText || 'Forgot Password?';
          dismissBtn.textContent = dismissText || 'Cancel';
          if (email) { emailInput.value = email; }
          pwInput.value = '';
          this.setError('');
          this.setBusy(false);
          overlay.style.display = 'flex';
          setTimeout(function () {
            (emailInput.value ? pwInput : emailInput).focus();
          }, 60);
        },
        hide: function () {
          overlay.style.display = 'none';
          this.setBusy(false);
          // Clear sensitive fields and sever Dart callback references so
          // credentials are not retained in the DOM after dismissal.
          emailInput.value = '';
          pwInput.value = '';
          this.setError('');
          this.onSubmit = null;
          this.onForgot = null;
          this.onDismiss = null;
        },
        setError: function (msg) {
          if (msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
          } else {
            errorEl.textContent = '';
            errorEl.style.display = 'none';
          }
        },
        setBusy: function (busy) {
          submitBtn.disabled = !!busy;
          emailInput.disabled = !!busy;
          pwInput.disabled = !!busy;
        }
      };

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = (emailInput.value || '').trim();
        var pw = pwInput.value || '';
        if (!email || !pw) {
          ctrl.setError(' ');
          return;
        }
        ctrl.setError('');
        ctrl.setBusy(true);
        if (typeof ctrl.onSubmit === 'function') {
          ctrl.onSubmit(email, pw);
        }
      });

      forgotBtn.addEventListener('click', function () {
        if (typeof ctrl.onForgot === 'function') { ctrl.onForgot(); }
      });
      dismissBtn.addEventListener('click', function () {
        if (typeof ctrl.onDismiss === 'function') { ctrl.onDismiss(); }
      });

      window.agathaNativeLogin = ctrl;
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
