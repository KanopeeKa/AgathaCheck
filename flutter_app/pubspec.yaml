name: pet_profile_app
description: A modular Flutter app for managing pet profiles with clean architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  uuid: ^4.6.0
  http: ^1.6.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  purchases_flutter: ^10.9.1
  purchases_ui_flutter: ^10.9.1
  flutter_secure_storage: ^11.0.0
  file_picker: ^12.0.0
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  posthog_flutter: ^5.36.0

  web: any
  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.7.0
  build_runner: ^2.15.1

  plugin_platform_interface: any
  url_launcher_platform_interface: any
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/dashboard/
    - assets/landing/
    - assets/demo_pets/
    - assets/logo-plum.png
    - assets/logo-plum-dark.png
    - assets/logo-plum.jpg
    - assets/logo-teal.png
    - assets/logo-teal.jpg
    - assets/logo-guardian-light-teal.png
    - assets/rainbow_wings.png
    - assets/legal/en/
    - assets/legal/fr/
