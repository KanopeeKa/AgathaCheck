name: Set up Flutter
description: Install Flutter SDK with tool-cache and one retry on download flake.

inputs:
  flutter-version:
    description: Flutter version (e.g. 3.44.0)
    required: true
  channel:
    description: Flutter channel
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Set up Flutter (attempt 1)
      id: attempt1
      uses: subosito/flutter-action@v2
      continue-on-error: true
      with:
        channel: ${{ inputs.channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: false

    - name: Warn before Flutter setup retry
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: echo "::warning::Retrying Flutter setup after first-attempt download failure"

    - name: Set up Flutter (retry after download flake)
      if: steps.attempt1.outcome == 'failure'
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: false

    - name: Verify Flutter and Dart versions
      shell: bash
      env:
        EXPECTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        flutter_version="$(flutter --version 2>&1 | head -n 1)"
        dart_version="$(dart --version 2>&1)"
        echo "${flutter_version}"
        echo "${dart_version}"
        [[ "${flutter_version}" == "Flutter ${EXPECTED_FLUTTER_VERSION} "* ]] || {
          echo "::error::Expected Flutter ${EXPECTED_FLUTTER_VERSION}; found ${flutter_version}"
          exit 1
        }
        dart --version 2>&1 | grep -Eq 'Dart SDK version: 3\.(1[2-9]|[2-9][0-9])(\.| )' || {
          echo "::error::Expected Dart 3.12 or newer; found ${dart_version}"
          exit 1
        }
