name: Set up lcov
description: Install lcov with apt archive cache (skip when already present).

runs:
  using: composite
  steps:
    - name: Cache apt archives for lcov
      uses: actions/cache@v5
      id: apt-cache
      with:
        path: |
          /var/cache/apt/archives
        key: apt-lcov-${{ runner.os }}-v1
        restore-keys: |
          apt-lcov-${{ runner.os }}-

    - name: Install lcov
      shell: bash
      run: |
        if command -v lcov >/dev/null 2>&1; then
          echo "::notice::lcov already available: $(lcov --version | head -1)"
          exit 0
        fi

        apt_update() {
          timeout 120s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
        }

        disable_flaky_third_party_apt_sources() {
          local source
          while IFS= read -r source; do
            [[ -z "$source" ]] && continue
            sudo mv "$source" "${source}.disabled"
            echo "::warning::Temporarily disabled apt source: $source"
          done < <(
            grep -rl 'dl.google.com/linux/chrome' \
              /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
          )
        }

        restore_disabled_apt_sources() {
          local disabled
          for disabled in /etc/apt/sources.list.d/*.disabled; do
            [[ -e "$disabled" ]] || continue
            sudo mv "$disabled" "${disabled%.disabled}"
          done
        }

        if ! apt_update; then
          echo "::warning::apt update failed; retrying after mirror and third-party source fallbacks."
          disable_flaky_third_party_apt_sources
          mapfile -t apt_sources < <(
            grep -rl 'http://azure.archive.ubuntu.com/ubuntu' \
              /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
          )
          if [[ ${#apt_sources[@]} -gt 0 ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              "${apt_sources[@]}"
          fi
          apt_update || {
            restore_disabled_apt_sources
            echo "::error::apt update failed after mirror and third-party source fallbacks." >&2
            exit 1
          }
          restore_disabled_apt_sources
        fi

        timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
          -o Acquire::Retries=2 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          install -y lcov
        lcov --version | head -1

    - name: lcov apt cache summary
      shell: bash
      run: |
        if [[ "${{ steps.apt-cache.outputs.cache-hit }}" == "true" ]]; then
          echo "::notice::apt archive cache hit for lcov"
        else
          echo "::notice::lcov installed (apt cache miss)"
        fi
