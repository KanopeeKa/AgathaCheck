name: Set up Playwright browsers
description: Restore or install Playwright Chromium with apt deps (keyed on e2e package lock).

inputs:
  working-directory:
    description: Directory containing package-lock.json for cache key
    required: false
    default: e2e

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
        echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        npx playwright install chromium --with-deps

        headless_shell_dir="$(
          npx playwright install --dry-run chromium |
            awk '/Chrome Headless Shell/{getline; print $3; exit}'
        )"
        headless_shell="$headless_shell_dir/chrome-headless-shell-linux64/chrome-headless-shell"

        if [[ ! -x "$headless_shell" ]]; then
          echo "::warning::Playwright Chromium cache is missing the expected headless shell; forcing browser reconciliation"
          npx playwright install chromium --with-deps --force
        fi

        if [[ ! -x "$headless_shell" ]]; then
          echo "::error::Playwright headless shell is still missing: $headless_shell"
          exit 1
        fi

    - name: Playwright cache summary
      shell: bash
      run: |
        if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
          echo "::notice::Playwright browser cache hit"
        else
          echo "::notice::Playwright browsers installed (cache miss)"
        fi
