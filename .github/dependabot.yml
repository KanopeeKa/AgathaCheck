version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - server
    ignore:
      # Express 5 needs a dedicated migration PR (breaking API / test failures).
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      # ESLint 10 + @eslint/js 10 need a coordinated config migration.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # nodemailer 10.x breaking changes need a dedicated review PR.
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - e2e

  - package-ecosystem: pub
    directory: /flutter_app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    # go_router major bumps need a dedicated migration PR.
    # intl is pinned by flutter_localizations from the Flutter SDK.
    ignore:
      - dependency-name: "go_router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "intl"
      # web 1.1.2 requires Dart ^3.13; CI pins Flutter 3.44 / Dart 3.12.
      - dependency-name: "web"
        versions: ["1.1.2"]
      # file_picker 12.1.2 breaks web/android builds (darwinOptions API mismatch).
      - dependency-name: "file_picker"
        versions: ["12.1.2"]
      # Riverpod 3.x needs a dedicated migration PR (Provider API changes).
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]
      # posthog_flutter 5.55.0 exceeds CI main.dart.js bundle budget (needs trim or budget bump).
      - dependency-name: "posthog_flutter"
        versions: ["5.55.0"]
