version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - server

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - e2e

  - package-ecosystem: pub
    directory: /flutter_app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    # go_router major bumps need a dedicated migration PR.
    # intl is pinned by flutter_localizations from the Flutter SDK.
    ignore:
      - dependency-name: "go_router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "intl"
      # 12.1.x breaks web/android builds (darwinOptions API mismatch vs platform interface).
      - dependency-name: "file_picker"
        versions: ["12.1.2"]
