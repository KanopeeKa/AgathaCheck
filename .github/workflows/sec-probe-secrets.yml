# Post-merge security probe for #1941 / #1952. Never merge: delete with the branch.
# Reports only whether each secret is readable from a head-defined pull_request workflow.
name: sec-probe-secrets
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  repo-scope:
    name: repo scope (no environment)
    runs-on: ubuntu-latest
    env:
      P_EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
      P_cursor_api_key: ${{ secrets.cursor_api_key }}
      P_GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
      P_GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
      P_GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
      P_E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
      P_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      P_UAT_SSH_USER: ${{ secrets.UAT_SSH_USER }}
      P_UAT_SSH_HOST: ${{ secrets.UAT_SSH_HOST }}
      P_UAT_SSH_PORT: ${{ secrets.UAT_SSH_PORT }}
      P_UAT_SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
      P_UAT_SSH_PASSPHRASE: ${{ secrets.UAT_SSH_PASSPHRASE }}
      P_UAT_CPANEL_API_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
      P_UAT_FTP_USERNAME: ${{ secrets.UAT_FTP_USERNAME }}
      P_UAT_FTP_SERVER: ${{ secrets.UAT_FTP_SERVER }}
      P_UAT_FTP_PASSWORD: ${{ secrets.UAT_FTP_PASSWORD }}
      P_UAT_BASIC_AUTH_USER: ${{ secrets.UAT_BASIC_AUTH_USER }}
      P_UAT_BASIC_AUTH_PASSWORD: ${{ secrets.UAT_BASIC_AUTH_PASSWORD }}
      P_PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      P_PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      P_PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      P_PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      P_PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      P_PROD_CPANEL_API_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
      P_PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
      P_PROD_FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
      P_PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
    steps:
      - name: Report secret presence (lengths only, never values)
        run: |
          for v in $(compgen -v P_ | sort); do
            n="${v#P_}"; val="${!v}"
            if [ -n "$val" ]; then echo "$n present (len ${#val})"; else echo "$n absent"; fi
          done
  env-automation:
    name: environment automation
    runs-on: ubuntu-latest
    environment: automation
    env:
      P_EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
      P_cursor_api_key: ${{ secrets.cursor_api_key }}
      P_GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
      P_GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
      P_GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
      P_E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
