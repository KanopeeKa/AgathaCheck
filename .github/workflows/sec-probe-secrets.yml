name: sec-probe-secrets
on: pull_request
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence (never values)
        env:
          A: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          B: ${{ secrets.cursor_api_key }}
        run: |
          for n in A B; do v="${!n}"; if [ -n "$v" ]; then echo "$n present (len ${#v})"; else echo "$n absent"; fi; done
