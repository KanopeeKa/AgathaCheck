# Shared Node governance + backend tests for CI.
# Flutter jobs are parallelized in ci.yml (analyze, shards, coverage, integration, build-web).
# Called by ci.yml — not used on deploy workflows (UAT/prod trust CI + env gates).
name: Reusable tests

on:
  workflow_call:
    inputs:
      run_backend:
        description: Run backend Jest + server npm audit
        type: boolean
        default: true
      run_e2e_audit:
        description: Run e2e package npm audit
        type: boolean
        default: true
      run_backend_integration:
        description: Run backend integration tests on ephemeral PostgreSQL
        type: boolean
        default: true
      run_lint:
        description: Run ESLint ratchet on Pet Care policy modules
        type: boolean
        default: true

env:
  NODE_VERSION: '22'

jobs:
  governance:
    name: Governance (BDD + file size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: BDD scenario coverage gate (live script)
        run: node e2e/scripts/check_bdd_coverage.js

      - name: Frozen domain boundary (active tree)
        run: bash scripts/check_frozen_domain_boundaries.sh

      - name: Test quality scorecard (depth metrics)
        run: node e2e/scripts/check_test_quality.js --report-only

      - name: Playwright shard manifest (enforce completeness)
        run: node e2e/scripts/validate-shard-manifest.mjs

      - name: Smoke tag invariant (@smoke-ci ⊆ @smoke-uat)
        run: node e2e/scripts/check-smoke-tags.mjs

      - name: BDD priority tags (@P0/@P1/@P2 on every scenario)
        run: node scripts/check_bdd_priority_tags.js

      - name: File size gate (500 lines)
        run: node scripts/check_file_size.js

      - name: CI gate assertion tests
        run: node --test scripts/ci/assert-ci-gate.test.js

      - name: Write governance job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI governance job" \
            "workflow=reusable-test" \
            "job=governance" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  backend:
    name: Backend (Node.js Jest)
    if: inputs.run_backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: npm audit (high and above)
        working-directory: server
        run: npm audit --audit-level=high

      - name: Run backend tests with coverage
        working-directory: server
        run: npm test -- --forceExit --coverage

      - name: Upload Jest coverage
        uses: actions/upload-artifact@v6
        with:
          name: jest-coverage
          path: server/coverage/
          if-no-files-found: warn

      - name: Write backend job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI backend job" \
            "workflow=reusable-test" \
            "job=backend" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  e2e-audit:
    name: E2E package audit
    if: inputs.run_e2e_audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: npm audit (high and above)
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Write E2E audit job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI E2E audit job" \
            "workflow=reusable-test" \
            "job=e2e-audit" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  backend-integration:
    name: Backend integration (PostgreSQL)
    if: inputs.run_backend_integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agatha_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d agatha_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Bootstrap database schema
        env:
          PGUSER: user
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: agatha_db
        run: |
          chmod +x e2e/scripts/bootstrap-db.sh
          ./e2e/scripts/bootstrap-db.sh
      - name: Run integration tests (db/seeds suite)
        env:
          PGUSER: user
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: agatha_db
        working-directory: server
        run: npx jest -c jest.config.active.cjs --env=node --runInBand --forceExit test/db
      - name: Write integration job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI backend integration job" \
            "workflow=reusable-test" \
            "job=backend-integration" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  lint:
    name: ESLint (Pet Care policy ratchet)
    if: inputs.run_lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: ESLint ratchet on policy modules (F-20)
        run: node scripts/validate_eslint.js
      - name: Ratchet assertion tests
        run: node --test scripts/validate_eslint.test.js
      - name: Write lint job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI lint job" \
            "workflow=reusable-test" \
            "job=lint" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
