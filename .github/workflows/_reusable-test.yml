# Shared Node governance + backend tests for CI.
# Flutter jobs are parallelized in ci.yml (analyze, shards, coverage, integration, build-web).
# Called by ci.yml — not used on deploy workflows (UAT/prod trust CI + env gates).
name: Reusable tests

on:
  workflow_call:

env:
  NODE_VERSION: '22'

jobs:
  governance:
    name: Governance (BDD + file size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: BDD scenario coverage gate (≥105 mapped)
        run: node e2e/scripts/check_bdd_coverage.js

      - name: BDD priority tags (@P0/@P1/@P2 on every scenario)
        run: node scripts/check_bdd_priority_tags.js

      - name: File size gate (500 lines)
        run: node scripts/check_file_size.js

      - name: Write governance job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI governance job" \
            "workflow=reusable-test" \
            "job=governance" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  backend:
    name: Backend (Node.js Jest + Dart analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: npm audit (high and above)
        working-directory: server
        run: npm audit --audit-level=high

      - name: Run backend tests with coverage
        working-directory: server
        run: npx jest --env=node --forceExit --coverage

      - name: Upload Jest coverage
        uses: actions/upload-artifact@v6
        with:
          name: jest-coverage
          path: server/coverage/
          if-no-files-found: warn

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.8.0'

      - name: Dart analyze (server lib)
        working-directory: server
        run: dart pub get && dart analyze lib

      - name: Write backend job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI backend job" \
            "workflow=reusable-test" \
            "job=backend" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  e2e-audit:
    name: E2E package audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: npm audit (high and above)
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Write E2E audit job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "CI E2E audit job" \
            "workflow=reusable-test" \
            "job=e2e-audit" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
