# Shared Flutter + Node test suite for CI.
# Called by ci.yml — not used on deploy workflows (UAT/prod trust CI + env gates).
name: Reusable tests

on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.32.0'
  NODE_VERSION: '22'

jobs:
  governance:
    name: Governance (BDD + file size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: BDD scenario coverage gate (≥105 mapped)
        run: node e2e/scripts/check_bdd_coverage.js

      - name: BDD priority tags (@P0/@P1/@P2 on every scenario)
        run: node scripts/check_bdd_priority_tags.js

      - name: File size gate (500 lines)
        run: node scripts/check_file_size.js

  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: flutter_app
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build
          else
            echo "build_runner not configured; skipping codegen."
          fi

      - name: Check Dart format
        run: |
          (cd server && dart pub get)
          dart format --output=none --set-exit-if-changed flutter_app/lib flutter_app/test server/lib

      - name: Sync legal documents into app assets
        run: dart run scripts/sync_legal_documents.dart

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Install lcov (merge per-file Flutter coverage)
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run unit & widget tests with coverage
        timeout-minutes: 35
        working-directory: flutter_app
        run: bash scripts/run_tests_ci.sh

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter_app/coverage/lcov.info
          if-no-files-found: warn

      - name: Run integration tests (if present)
        timeout-minutes: 10
        working-directory: flutter_app
        run: |
          if [ -d "test/features/pet_profile/presentation/integration" ]; then
            flutter test test/features/pet_profile/presentation/integration/ --concurrency=1 --fail-fast
          else
            echo "No integration tests directory found; skipping."
          fi

      - name: Inject PostHog web snippet
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: bash scripts/inject_posthog_web.sh

      - name: Build web release
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          flutter build web --release --no-tree-shake-icons \
            --dart-define=POSTHOG_API_KEY=${POSTHOG_API_KEY} \
            --dart-define=POSTHOG_HOST=https://eu.i.posthog.com

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web/

  backend:
    name: Backend (Node.js Jest + Dart analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: npm audit (high and above)
        working-directory: server
        run: npm audit --audit-level=high

      - name: Run backend tests with coverage
        working-directory: server
        run: npx jest --env=node --forceExit --coverage

      - name: Upload Jest coverage
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: server/coverage/
          if-no-files-found: warn

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.8.0'

      - name: Dart analyze (server lib)
        working-directory: server
        run: dart pub get && dart analyze lib

  e2e-audit:
    name: E2E package audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: npm audit (high and above)
        working-directory: e2e
        run: npm audit --audit-level=high
