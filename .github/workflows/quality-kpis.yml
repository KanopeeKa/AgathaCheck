# Advisory CI health KPIs (PR CI duration, Pre-UAT pass rate, remedial commit share).
name: Quality KPIs (weekly)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kpis:
    name: CI health KPIs (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Compute KPIs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/quality/ci-health-kpis.mjs --days 14 | tee ci-health-kpis.md

      - name: Upload KPI summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-health-kpis
          path: ci-health-kpis.md
          retention-days: 14
          if-no-files-found: ignore

  docs-hygiene:
    name: Weekly docs hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      DOCS_GATE_MODE: warn
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install backend deps
        run: cd server && npm ci

      - name: Collect docs hygiene findings
        id: hygiene
        run: |
          set -uo pipefail
          collect() {
            local out="$1"
            shift
            set +e
            "$@" >"$out" 2>&1
            local code=$?
            set -e
            echo "${out%.txt}=$code" >> collection-exits.env
            if [[ "$code" -gt 1 ]]; then
              echo "::error::Unexpected exit $code from: $*"
              exit "$code"
            fi
          }
          : > collection-exits.env
          collect changes-report.txt node scripts/check_docs_canonical.js --changes --all
          collect dup-report.txt node scripts/check_docs_canonical.js --ids --report-duplicates
          collect trace-report.txt node scripts/check_docs_canonical.js --trace --closed-issues
          collect memory-report.txt node scripts/check_docs_canonical.js --memory --all
          node scripts/check_docs_canonical.js --baseline-report > baseline-report.json
          node scripts/check_docs_canonical.js --report --json > docs-trace.json

      - name: Open or update docs-hygiene issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="<!-- docs-hygiene-weekly -->"
          BODY="${MARKER}
          ## Expired proposals (R-B5)
          \`\`\`
          $(grep R-B5 changes-report.txt || echo none)
          \`\`\`
          ## Stale in-delivery (R-B6)
          \`\`\`
          $(grep R-B6 changes-report.txt || echo none)
          \`\`\`
          ## Closed-issue AC rows (R-T4)
          \`\`\`
          $(grep R-T4 trace-report.txt || echo none)
          \`\`\`
          ## Duplicate IDs (R-D3)
          \`\`\`
          $(grep R-D3 dup-report.txt || echo none)
          \`\`\`
          ## Product rules still in memory (R-M1 / R-M4)
          \`\`\`
          $(grep -E 'R-M[14]' memory-report.txt || echo none)
          \`\`\`
          ## Legacy baseline counts
          \`\`\`
          $(cat baseline-report.json)
          \`\`\`"
          EXISTING=$(gh issue list --label docs-hygiene --search "in:title Docs hygiene weekly" --state all --limit 1 --json number --jq 'if length > 0 then .[0].number else "" end')
          if [[ -z "$EXISTING" ]]; then
            gh issue create --title "Docs hygiene weekly" --label tech-debt --label docs-hygiene --body "$BODY"
          else
            gh issue edit "$EXISTING" --body "$BODY"
          fi
