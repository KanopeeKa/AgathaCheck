# Non-blocking PR hints for governance (does not change CI gates).
name: PR governance hints

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hints:
    name: Governance hints (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Collect advisory notes
        id: notes
        run: |
          set -euo pipefail
          NOTES=""
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          BODY_FILE="$RUNNER_TEMP/governance-hint-body.md"

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              flutter_app/lib/*|server/routes/*|server/lib/*)
                if [[ -f "$f" ]] && [[ "$f" != *.g.dart && "$f" != *.mocks.dart ]]; then
                  lines=$(wc -l < "$f" | tr -d ' ')
                  if [[ "$lines" -gt 450 ]]; then
                    NOTES="${NOTES}"$'\n'"- ⚠️ \`${f}\` is **${lines}** lines (CI blocks >500). Consider splitting before merge."
                  fi
                fi
                ;;
            esac
          done <<< "$CHANGED"

          if echo "$CHANGED" | grep -qE '^e2e/playwright/tests/'; then
            NOTES="${NOTES}"$'\n'"- 📋 BDD specs changed — ensure \`@bdd\` headers match Gherkin \`Scenario:\` titles exactly. Run \`node e2e/scripts/check_bdd_coverage.js\`."
          fi

          if echo "$CHANGED" | grep -qE '^(scripts/|\.cursor/|docs/agent-efficiency)'; then
            NOTES="${NOTES}"$'\n'"- 🤖 Agent infra changed — run \`./scripts/pre-push.sh\` before merge."
          fi

          # Multi-area advisory (outcome-based policy — not a block). See docs/agent-efficiency/atomic-pr-policy.md
          tag_area() {
            case "$1" in
              flutter_app/lib/features/auth/*|server/routes/auth/*|server/lib/auth/*|server/test/auth/*|e2e/playwright/tests/auth.*.spec.ts)
                echo "auth" ;;
              flutter_app/lib/features/pet_profile/*|server/routes/pets/*|server/test/pets/*|e2e/playwright/tests/pet.*.spec.ts)
                echo "pets" ;;
              flutter_app/lib/features/health_tracking/*|server/routes/health*|server/test/health*|e2e/playwright/tests/health.*.spec.ts)
                echo "health" ;;
              flutter_app/lib/features/weight_tracking/*|server/routes/weight*|server/test/weight*|e2e/playwright/tests/weight.*.spec.ts)
                echo "weight" ;;
              flutter_app/lib/features/vet/*|server/routes/vets*|server/test/vets*)
                echo "vet" ;;
              flutter_app/lib/features/sharing/*|server/routes/sharing*|server/test/sharing*|e2e/playwright/tests/sharing.spec.ts)
                echo "sharing" ;;
              flutter_app/lib/features/notifications/*|server/routes/notifications*|server/test/notifications*|e2e/playwright/tests/notifications.spec.ts)
                echo "notifications" ;;
              flutter_app/lib/features/organization/*|server/routes/organizations/*|server/routes/foster*|server/routes/custody*|server/test/organizations/*|server/test/foster*|server/test/custody*|e2e/playwright/tests/organisation*|e2e/playwright/tests/adoption*)
                echo "org" ;;
              flutter_app/lib/features/subscription/*)
                echo "subscription" ;;
              flutter_app/lib/features/help/*|flutter_app/lib/features/about/*)
                echo "help" ;;
              flutter_app/lib/core/*|flutter_app/lib/l10n/*)
                echo "core-flutter" ;;
              e2e/playwright/tests/*|e2e/playwright/pages/*|e2e/playwright/support/*)
                echo "e2e" ;;
              *) ;;
            esac
          }

          AREAS=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            tag="$(tag_area "$f")"
            [[ -n "$tag" ]] && AREAS="${AREAS}"$'\n'"${tag}"
          done <<< "$CHANGED"
          UNIQUE_AREAS="$(echo "$AREAS" | sed '/^$/d' | sort -u)"
          AREA_COUNT="$(echo "$UNIQUE_AREAS" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ "$AREA_COUNT" -ge 2 ]]; then
            AREA_LIST="$(echo "$UNIQUE_AREAS" | sed '/^$/d' | paste -sd ', ' -)"
            NOTES="${NOTES}"$'\n'"- 📐 Touches **${AREA_COUNT}** areas (\`${AREA_LIST}\`). **OK if one outcome** (see \`docs/agent-efficiency/atomic-pr-policy.md\`). Split if changes are independent."
          fi

          if [[ -z "$NOTES" ]]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            printf "### Governance hints (advisory)%s\n\n*CI gates remain authoritative; this comment does not block merge.*" "$NOTES" > "$BODY_FILE"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: steps.notes.outputs.has_notes == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- governance-hints -->';
            const body = marker + '\n' + fs.readFileSync('${{ steps.notes.outputs.body_file }}', 'utf8');
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Could not post governance hint comment: ${err.message}`);
            }
