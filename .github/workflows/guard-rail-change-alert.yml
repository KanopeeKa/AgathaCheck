# Secondary control: alerts when .github/** changes on main. A malicious commit can remove
# this workflow in the same push; primary signal is PR merge notifications (owner watches repo).
name: Guard-rail change alert

on:
  push:
    branches: [main]
    paths:
      - '.github/**'

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: Open guard-rail change issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changed paths under .github
        id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] || [ -z "${BEFORE_SHA}" ]; then
            mapfile -t files < <(git diff --name-only HEAD -- '.github/**' | sort -u)
          else
            mapfile -t files < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- '.github/**' | sort -u)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "has_changes=true"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find linked PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          num="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$num" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update guard-rail issue
        if: steps.paths.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES: ${{ steps.paths.outputs.files }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          title="Guard-rail change on main (${GITHUB_SHA:0:7})"
          pr_line="PR: n/a"
          if [ -n "${PR_NUMBER}" ]; then
            pr_line="PR: #${PR_NUMBER}"
          fi
          body=$(cat <<EOF
          Guard-rail paths changed on \`main\`.

          | Field | Value |
          |-------|-------|
          | Commit | \`${GITHUB_SHA}\` |
          | Author | \`${GITHUB_ACTOR}\` |
          | ${pr_line} | |

          ### Changed files
          \`\`\`
          ${CHANGED_FILES}
          \`\`\`

          This issue is opened/updated automatically by \`guard-rail-change-alert.yml\` (secondary control).
          EOF
          )
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label guard-rail-change --state open --json number,title --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label guard-rail-change --body "$body"
          fi
