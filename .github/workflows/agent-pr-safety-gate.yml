name: Agent PR safety gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  safety:
    name: Forbidden path check
    if: startsWith(github.head_ref, 'cursor/') || startsWith(github.head_ref, 'replit/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check forbidden paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/agent-pr-safety-check.js

      - name: Comment when safety gate fails
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- agent-pr-safety-gate -->';
            const body = `${marker}
            ## Agent PR safety gate failed

            This PR from an agent branch modifies forbidden paths (workflows, migrations, security config, infra, etc.).

            Please review manually or close the PR and handle the linked issue with a human implementation.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
