name: Scope status probe
on:
  pull_request:
    types: [labeled]
    branches: [cursor/scope-status-probe-base-4f52]
permissions:
  statuses: write
jobs:
  post:
    if: github.event.label.name == 'probe-go'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success -f context=scope-status-probe -f description="ok: probe via GITHUB_TOKEN"
