# Canonical Flutter prep for parallel CI shards: build_runner mocks + synced legal assets,
# uploaded once as flutter-prep-<sha>. Split out of flutter-analyze so test shards start
# without waiting for format + analyze (plan test-health-ci-5f3a phase 2).
# Callers: ci.yml / ci-full-audit.yml job id `flutter-prep`.
name: Reusable Flutter prep

on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.44.0'

permissions:
  contents: read

jobs:
  prep:
    name: Flutter prep (codegen + legal assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sync legal documents into app assets
        run: node scripts/sync_legal_documents.js

      - name: Stage Flutter prep artifact
        run: bash scripts/ci/stage-flutter-prep-artifact.sh

      - name: Upload Flutter prep artifact
        uses: actions/upload-artifact@v6
        with:
          name: flutter-prep-${{ github.sha }}
          path: flutter-prep-artifact.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Write prep job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Flutter prep job" \
            "workflow=flutter-prep" \
            "job=prep" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
