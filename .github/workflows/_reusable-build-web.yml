# Shared Flutter web release build with manifest + verification.
# Called by deploy workflows (UAT build job; PROD rebuild fallback).
name: Reusable build Flutter web

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout before build (branch, tag, or SHA)
        type: string
        default: ''
      run_clean:
        description: Run flutter clean before build
        type: boolean
        default: false
      run_codegen:
        description: Run build_runner before build
        type: boolean
        default: true
      upload_artifact:
        description: Upload flutter_app/build/web as a workflow artifact
        type: boolean
        default: true
      source_workflow:
        description: Provenance label written to build-manifest.json (empty = caller workflow name)
        type: string
        default: ''
      use_flutter_prep_artifact:
        description: Restore flutter-prep-<sha> from flutter-analyze (CI only)
        type: boolean
        default: false
    secrets:
      POSTHOG_API_KEY:
        required: false
    outputs:
      artifact_name:
        description: Uploaded artifact name (web-build-<sha>)
        value: ${{ jobs.build-web.outputs.artifact_name }}
      deploy_sha:
        description: Commit SHA that was built
        value: ${{ jobs.build-web.outputs.deploy_sha }}
      resolved_run_clean:
        description: Effective flutter clean flag used by the build job
        value: ${{ jobs.build-web.outputs.resolved_run_clean }}

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build-web:
    name: Build Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      resolved_run_clean: ${{ steps.meta.outputs.resolved_run_clean }}
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Resolve build metadata
        id: meta
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=${sha}"
            echo "deploy_sha=${sha}"
            echo "artifact_name=web-build-${sha}"
            echo "resolved_run_clean=${{ inputs.run_clean }}"
          } >> "$GITHUB_OUTPUT"

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Flutter clean experiment notice
        if: inputs.run_clean != true
        run: |
          echo "::notice::flutter clean skipped (Phase 4 UAT experiment). Set repo variable UAT_FLUTTER_CLEAN=true or workflow_dispatch run_clean=true to restore."

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Download Flutter prep artifact
        if: inputs.use_flutter_prep_artifact
        uses: actions/download-artifact@v6
        with:
          name: flutter-prep-${{ github.sha }}

      - name: Verify Flutter prep download
        if: inputs.use_flutter_prep_artifact
        run: bash scripts/ci/verify-flutter-prep-download.sh flutter-prep-artifact.tar.gz "${{ github.sha }}"

      - name: Restore Flutter prep state
        if: inputs.use_flutter_prep_artifact
        run: bash scripts/ci/restore-flutter-prep-artifact.sh flutter-prep-artifact.tar.gz

      - name: Build Flutter web (shared)
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          RUN_CLEAN: ${{ inputs.run_clean }}
          RUN_CODEGEN: ${{ inputs.run_codegen }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow != '' && inputs.source_workflow || github.workflow }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: bash scripts/ci/build-flutter-web.sh

      - name: Upload web artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: flutter_app/build/web/
          retention-days: 30

      - name: Write build job summary
        if: always()
        run: |
          if [[ "${{ steps.checkout.outcome }}" != "success" ]]; then
            {
              echo "### Flutter web build job"
              echo
              echo "Checkout failed — the deploy ref may not exist on origin. See the **Validate deploy ref** job or checkout step logs."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Flutter web build job" \
            "workflow=reusable-build-web" \
            "job=build-web" \
            "sha=${{ steps.meta.outputs.sha }}" \
            "resolved_run_clean=${{ inputs.run_clean }}" \
            "use_flutter_prep_artifact=${{ inputs.use_flutter_prep_artifact }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}" \
            "artifact=${{ steps.meta.outputs.artifact_name }}"
