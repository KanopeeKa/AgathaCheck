name: UAT promote catch-up

# When merge-triggered promote-uat is blocked by the deploy cadence gate, this
# workflow promotes the latest main HEAD once the interval elapses.
on:
  schedule:
    # Every 30 minutes — cadence script enforces the full min interval (default 90m).
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      force_cadence:
        description: Bypass deploy cadence gate (emergency)
        type: boolean
        default: false

concurrency:
  group: promote-uat-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  resolve-pr:
    name: Resolve main HEAD PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      promotion_status: ${{ steps.resolve.outputs.promotion_status }}
      promotion_block_reason: ${{ steps.resolve.outputs.promotion_block_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve associated pull request for main HEAD
        id: resolve
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/resolve-merge-pr.sh

      - name: Write catch-up resolve summary
        if: always()
        run: |
          bash scripts/ci/append-summary.sh "UAT promote catch-up — resolve PR" \
            "workflow=uat-promote-catchup" \
            "job=resolve-pr" \
            "commit_sha=${{ github.sha }}" \
            "pr_number=${{ steps.resolve.outputs.pr_number || 'n/a' }}" \
            "promotion_status=${{ steps.resolve.outputs.promotion_status || 'blocked' }}" \
            "promotion_block_reason=${{ steps.resolve.outputs.promotion_block_reason || 'n/a' }}" \
            "run_id=${{ github.run_id }}"

  evaluate-promote-hold:
    name: Evaluate UAT queue promote hold
    needs: resolve-pr
    if: needs.resolve-pr.outputs.promotion_status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promotion_status: ${{ steps.hold.outputs.promotion_status }}
      promotion_block_reason: ${{ steps.hold.outputs.promotion_block_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/evaluate-uat-promote-hold.js
            scripts/ci/append-summary.sh
            scripts/lib/uat_queue_lib.js
            scripts/lib/uat_queue_sync.js
            scripts/lib/uat_queue_constants.js
            scripts/lib/execute_plan_project.js
            .github/scripts/github-project-lib.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Evaluate queue promote hold
        id: hold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UAT_COORDINATION_ISSUE: ${{ vars.UAT_COORDINATION_ISSUE }}
          UAT_PROMOTE_HOLD_ENABLED: ${{ vars.UAT_PROMOTE_HOLD_ENABLED || 'true' }}
        run: node scripts/ci/evaluate-uat-promote-hold.js

  evaluate-promote-cadence:
    name: Evaluate UAT deploy cadence
    needs: [resolve-pr, evaluate-promote-hold]
    if: >-
      needs.resolve-pr.outputs.promotion_status == 'ok' &&
      needs.evaluate-promote-hold.outputs.promotion_status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promotion_status: ${{ steps.cadence.outputs.promotion_status }}
      promotion_block_reason: ${{ steps.cadence.outputs.promotion_block_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/evaluate-uat-promote-cadence.js
            scripts/ci/append-summary.sh
            scripts/lib/uat_deploy_cadence.js
            .github/scripts/github-project-lib.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Evaluate deploy cadence
        id: cadence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UAT_DEPLOY_MIN_INTERVAL_MINUTES: ${{ vars.UAT_DEPLOY_MIN_INTERVAL_MINUTES || '90' }}
          UAT_DEPLOY_CADENCE_ENABLED: ${{ vars.UAT_DEPLOY_CADENCE_ENABLED || 'true' }}
          UAT_DEPLOY_CADENCE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_cadence && 'true' || 'false' }}
        run: node scripts/ci/evaluate-uat-promote-cadence.js

  promote-tag:
    name: Create UAT tag (catch-up)
    needs: [resolve-pr, evaluate-promote-hold, evaluate-promote-cadence]
    if: >-
      needs.resolve-pr.outputs.promotion_status == 'ok' &&
      needs.evaluate-promote-hold.outputs.promotion_status == 'ok' &&
      needs.evaluate-promote-cadence.outputs.promotion_status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      uat_tag: ${{ steps.promote.outputs.uat_tag }}
      promotion_status: ${{ steps.promote.outputs.promotion_status }}
      already_promoted: ${{ steps.promote.outputs.already_promoted }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Create or verify UAT tag
        id: promote
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-uat-tag.sh

      - name: Write catch-up promote summary
        if: always()
        run: |
          bash scripts/ci/append-summary.sh "UAT promote catch-up — tag" \
            "workflow=uat-promote-catchup" \
            "job=promote-tag" \
            "commit_sha=${{ github.sha }}" \
            "pr_number=${{ needs.resolve-pr.outputs.pr_number }}" \
            "uat_tag=${{ steps.promote.outputs.uat_tag || 'n/a' }}" \
            "promotion_status=${{ steps.promote.outputs.promotion_status || 'skipped' }}" \
            "already_promoted=${{ steps.promote.outputs.already_promoted || 'false' }}" \
            "run_id=${{ github.run_id }}"
