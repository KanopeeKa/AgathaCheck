# Merge per-shard Flutter coverage and enforce the domain coverage gate.
# Caller: ci.yml job id `flutter-coverage` (after all test shards).
name: Reusable Flutter coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    name: Flutter domain coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flutter-coverage-*
          path: _coverage_shards
          merge-multiple: false

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Merge coverage and enforce gate
        working-directory: flutter_app
        run: bash scripts/merge_flutter_coverage.sh ../_coverage_shards

      - name: Upload merged Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter_app/coverage/lcov.info
          if-no-files-found: error

      - name: Write coverage job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Flutter coverage job" \
            "workflow=flutter-coverage" \
            "job=coverage" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
