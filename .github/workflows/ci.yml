# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clean and analyze Flutter code
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Clean build artifacts
        working-directory: flutter_app
        run: flutter clean
      - name: Fetch dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Run analyzer
        working-directory: flutter_app
        run: flutter analyze

      # Cache Flutter dependencies for faster builds
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Install Flutter app dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate mocks and code
        working-directory: flutter_app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Lint Flutter app (warnings OK)
        working-directory: flutter_app
        run: flutter analyze . || true

      - name: Test Flutter app with coverage
        working-directory: flutter_app
        run: flutter test --coverage

      - name: Run Flutter unit/widget tests
        working-directory: flutter_app
        run: flutter test test/

      - name: Run Flutter integration tests
        working-directory: flutter_app
        run: |
          if [ -d "test/features/pet_profile/presentation/integration/" ]; then
            flutter test test/features/pet_profile/presentation/integration/
          else
            echo "No integration tests found."
          fi

      - name: Build web release
        working-directory: flutter_app
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web/

      # Node.js backend tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Run backend tests
        working-directory: server
        run: |
          if [ -d "test" ]; then
            if ls test/*.js 1> /dev/null 2>&1; then
              npx jest test/*.js || npx mocha test/*.js
            else
              echo "No backend JS tests found."
            fi
          else
            echo "No backend tests directory found."
          fi

