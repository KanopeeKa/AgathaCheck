name: CI

# Caller job ids below map to GitHub required checks as `{job_id} / {reusable job name}`.
# See docs/pipelines/ci-cd-gates.md §1 (branch protection table).
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_full:
        description: Run full Flutter stack (ignore path scope)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-scope:
    name: Resolve CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope_json: ${{ steps.scope.outputs.scope_json }}
      scope_name: ${{ steps.scope.outputs.scope_name }}
      run_flutter_analyze: ${{ steps.scope.outputs.run_flutter_analyze }}
      run_flutter_stack: ${{ steps.scope.outputs.run_flutter_stack }}
      run_flutter_coverage: ${{ steps.scope.outputs.run_flutter_coverage }}
      run_shards: ${{ steps.scope.outputs.run_shards }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_e2e_audit: ${{ steps.scope.outputs.run_e2e_audit }}
      run_flutter_integration: ${{ steps.scope.outputs.run_flutter_integration }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve path scope
        id: scope
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          CI_SCOPE_HEAD_SHA: ${{ github.sha }}
          CI_SCOPE_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || 'false' }}
        run: bash scripts/ci/resolve-ci-scope.sh

  startup-smoke:
    uses: ./.github/workflows/_reusable-pr-startup-smoke.yml

  test-suite:
    needs: ci-scope
    uses: ./.github/workflows/_reusable-test.yml
    with:
      run_backend: ${{ needs.ci-scope.outputs.run_backend == 'true' }}
      run_e2e_audit: ${{ needs.ci-scope.outputs.run_e2e_audit == 'true' }}

  flutter-analyze:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_flutter_analyze == 'true'
    uses: ./.github/workflows/_reusable-flutter-analyze.yml

  flutter-test-pet-core:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'pet-core')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: pet-core

  flutter-test-pet-screens:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'pet-screens')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: pet-screens

  flutter-test-pet-widgets:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'pet-widgets')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: pet-widgets

  flutter-test-health:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'health')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: health

  flutter-test-org:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'org')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: org

  flutter-test-rest-a:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'rest-a')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: rest-a

  flutter-test-rest-b:
    needs: [ci-scope, flutter-analyze]
    if: >-
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      contains(fromJSON(needs.ci-scope.outputs.run_shards), 'rest-b')
    uses: ./.github/workflows/_reusable-flutter-test-shard.yml
    with:
      shard: rest-b

  flutter-coverage:
    needs:
      - ci-scope
      - flutter-test-pet-core
      - flutter-test-pet-screens
      - flutter-test-pet-widgets
      - flutter-test-health
      - flutter-test-org
      - flutter-test-rest-a
      - flutter-test-rest-b
    if: needs.ci-scope.outputs.run_flutter_coverage == 'true'
    uses: ./.github/workflows/_reusable-flutter-coverage.yml

  flutter-integration:
    needs: [ci-scope, flutter-analyze]
    if: needs.ci-scope.outputs.run_flutter_integration == 'true'
    uses: ./.github/workflows/_reusable-flutter-integration.yml

  flutter-build-web:
    needs: [ci-scope, flutter-analyze]
    if: needs.ci-scope.outputs.run_flutter_stack == 'true'
    uses: ./.github/workflows/_reusable-build-web.yml
    with:
      run_codegen: false
      use_flutter_prep_artifact: true
      source_workflow: ci
    secrets:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

  # PR canary — @smoke-ci (retries 0). Blocking via ci-gate (Phase 2b).
  ci-e2e-canary:
    needs: [ci-scope, flutter-build-web]
    if: >-
      always() &&
      needs.ci-scope.outputs.run_flutter_stack == 'true' &&
      needs.flutter-build-web.result == 'success'
    uses: ./.github/workflows/_reusable-e2e-local.yml
    with:
      test_suite: smoke-ci
      web_artifact_name: ${{ needs.flutter-build-web.outputs.artifact_name }}

  # Umbrella required check: ci-gate / CI passed (reusable workflow caller/reusable name form).
  # Maintenance: any new blocking ci.yml job MUST be added to needs: + inputs below and to
  # scripts/ci/assert-ci-gate.sh — see docs/pipelines/ci-cd-gates.md and docs/pipelines/promotion-contract.md.
  ci-gate:
    needs:
      - ci-scope
      - startup-smoke
      - test-suite
      - flutter-analyze
      - flutter-test-pet-core
      - flutter-test-pet-screens
      - flutter-test-pet-widgets
      - flutter-test-health
      - flutter-test-org
      - flutter-test-rest-a
      - flutter-test-rest-b
      - flutter-coverage
      - flutter-integration
      - flutter-build-web
      - ci-e2e-canary
    if: always()
    uses: ./.github/workflows/_reusable-ci-gate.yml
    with:
      ci_scope_json: ${{ needs.ci-scope.outputs.scope_json }}
      startup_smoke: ${{ needs.startup-smoke.result }}
      test_suite: ${{ needs.test-suite.result }}
      flutter_analyze: ${{ needs.flutter-analyze.result }}
      flutter_test_pet_core: ${{ needs.flutter-test-pet-core.result }}
      flutter_test_pet_screens: ${{ needs.flutter-test-pet-screens.result }}
      flutter_test_pet_widgets: ${{ needs.flutter-test-pet-widgets.result }}
      flutter_test_health: ${{ needs.flutter-test-health.result }}
      flutter_test_org: ${{ needs.flutter-test-org.result }}
      flutter_test_rest_a: ${{ needs.flutter-test-rest-a.result }}
      flutter_test_rest_b: ${{ needs.flutter-test-rest-b.result }}
      flutter_coverage: ${{ needs.flutter-coverage.result }}
      flutter_integration: ${{ needs.flutter-integration.result }}
      flutter_build_web: ${{ needs.flutter-build-web.result }}
      ci_e2e_canary: ${{ needs.ci-e2e-canary.result }}
