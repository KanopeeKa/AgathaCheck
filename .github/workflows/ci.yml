# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up Flutter instead of plain Dart
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # or beta/master if you prefer
          
      - name: Install Flutter app dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Lint Flutter app (warnings OK)
        working-directory: flutter_app
        run: flutter analyze . || true # Continues even if warnings

      - name: Test Flutter app with coverage
        working-directory: flutter_app
        run: flutter test --coverage

      - name: Build web release
        working-directory: flutter_app
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web/

      # Node.js backend tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Run backend tests
        working-directory: server
        run: |
          if [ -d "test" ]; then
            npx jest test/*.js || npx mocha test/*.js || echo "No backend test runner found."
          else
            echo "No backend tests found."
          fi

