# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Cache must be restored BEFORE `flutter pub get` to be effective.
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: flutter_app
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner not configured; skipping codegen."
          fi

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        working-directory: flutter_app
        run: flutter test --coverage

      - name: Run integration tests (if present)
        working-directory: flutter_app
        run: |
          if [ -d "test/features/pet_profile/presentation/integration" ]; then
            flutter test test/features/pet_profile/presentation/integration/
          else
            echo "No integration tests directory found; skipping."
          fi

      - name: Build web release
        working-directory: flutter_app
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web/

  backend:
    name: Backend (Node.js Jest tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run backend tests
        working-directory: server
        run: npx jest --env=node --forceExit
