name: Execute-plan driver
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      plan_id: { description: Plan id (empty = all active), required: false }
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, synchronize, closed]
  workflow_run:
    workflows: ['CI', 'Pre-UAT E2E', 'Promote UAT (tag on merge to main)', 'Deploy UAT (uat.agathatrack.com)']
    types: [completed]
  issues:
    types: [labeled, unlabeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  checks: write
concurrency:
  group: execute-plan-driver
  cancel-in-progress: false
jobs:
  # The automation environment only admits ref main, and pull_request_target runs on the PR base ref,
  # so PRs into integration branches wake the driver through a dispatch on main instead.
  relay:
    name: execute-plan-driver relay
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch driver on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run execute-plan-driver.yml --repo "$GITHUB_REPOSITORY" --ref main
  drive:
    name: execute-plan-driver
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Drive active plans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTE_PLAN_BOT_TOKEN: ${{ secrets.EXECUTE_PLAN_BOT_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.cursor_api_key }}
          EXECUTE_PLAN_DRIVER: ${{ vars.EXECUTE_PLAN_DRIVER }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
        run: |
          # Bootstrap: runs on PRs that add the driver check out `main`, which has no script until the merge.
          if [ ! -f .github/scripts/execute-plan-driver.js ]; then
            echo "execute-plan driver script is not on main yet; nothing to do"
            exit 0
          fi
          node .github/scripts/execute-plan-driver.js
