# Umbrella CI gate — caller job id + this job name → required check `ci-gate / CI passed`.
name: Reusable CI gate

on:
  workflow_call:
    inputs:
      ci_scope_json:
        description: JSON scope from ci-scope job (skip_jobs list)
        type: string
        default: ''
      startup_smoke:
        required: true
        type: string
      test_suite:
        required: true
        type: string
      flutter_analyze:
        required: true
        type: string
      flutter_test_pet_core:
        required: true
        type: string
      flutter_test_pet_screens:
        required: true
        type: string
      flutter_test_pet_widgets:
        required: true
        type: string
      flutter_test_health:
        required: true
        type: string
      flutter_test_org:
        required: true
        type: string
      flutter_test_rest_a:
        required: true
        type: string
      flutter_test_rest_b:
        required: true
        type: string
      flutter_coverage:
        required: true
        type: string
      flutter_integration:
        required: true
        type: string
      flutter_build_web:
        required: true
        type: string
      ci_e2e_canary:
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/assert-ci-gate.sh
          sparse-checkout-cone-mode: false

      - name: Verify all CI jobs passed
        env:
          CI_SCOPE_JSON: ${{ inputs.ci_scope_json }}
          STARTUP_SMOKE: ${{ inputs.startup_smoke }}
          TEST_SUITE: ${{ inputs.test_suite }}
          FLUTTER_ANALYZE: ${{ inputs.flutter_analyze }}
          FLUTTER_TEST_PET_CORE: ${{ inputs.flutter_test_pet_core }}
          FLUTTER_TEST_PET_SCREENS: ${{ inputs.flutter_test_pet_screens }}
          FLUTTER_TEST_PET_WIDGETS: ${{ inputs.flutter_test_pet_widgets }}
          FLUTTER_TEST_HEALTH: ${{ inputs.flutter_test_health }}
          FLUTTER_TEST_ORG: ${{ inputs.flutter_test_org }}
          FLUTTER_TEST_REST_A: ${{ inputs.flutter_test_rest_a }}
          FLUTTER_TEST_REST_B: ${{ inputs.flutter_test_rest_b }}
          FLUTTER_COVERAGE: ${{ inputs.flutter_coverage }}
          FLUTTER_INTEGRATION: ${{ inputs.flutter_integration }}
          FLUTTER_BUILD_WEB: ${{ inputs.flutter_build_web }}
          CI_E2E_CANARY: ${{ inputs.ci_e2e_canary }}
        run: bash scripts/ci/assert-ci-gate.sh
