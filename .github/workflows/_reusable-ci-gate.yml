# Umbrella CI gate — caller job id + this job name → required check `ci-gate / CI passed`.
name: Reusable CI gate

on:
  workflow_call:
    inputs:
      ci_scope_json:
        description: JSON scope from ci-scope job (skip_jobs list)
        type: string
        default: ''
      startup_smoke:
        required: true
        type: string
      test_suite:
        required: true
        type: string
      flutter_analyze:
        required: true
        type: string
      flutter_prep:
        description: Result of flutter-prep (codegen + legal assets artifact)
        required: false
        type: string
        default: ''
      flutter_test:
        description: Aggregate result of the flutter-test shard matrix
        required: true
        type: string
      flutter_coverage:
        required: true
        type: string
      flutter_integration:
        required: true
        type: string
      flutter_build_web:
        required: true
        type: string
      ci_e2e_canary:
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/assert-ci-gate.sh
          sparse-checkout-cone-mode: false

      - name: Verify all CI jobs passed
        env:
          CI_SCOPE_JSON: ${{ inputs.ci_scope_json }}
          STARTUP_SMOKE: ${{ inputs.startup_smoke }}
          TEST_SUITE: ${{ inputs.test_suite }}
          FLUTTER_ANALYZE: ${{ inputs.flutter_analyze }}
          FLUTTER_PREP: ${{ inputs.flutter_prep }}
          FLUTTER_TEST: ${{ inputs.flutter_test }}
          FLUTTER_COVERAGE: ${{ inputs.flutter_coverage }}
          FLUTTER_INTEGRATION: ${{ inputs.flutter_integration }}
          FLUTTER_BUILD_WEB: ${{ inputs.flutter_build_web }}
          CI_E2E_CANARY: ${{ inputs.ci_e2e_canary }}
        run: bash scripts/ci/assert-ci-gate.sh
