name: Promote UAT (tag on merge to main)

# Agent or human dispatches after localhost E2E green on the target commit.
# deploy-uat.yml chains via workflow_run (GITHUB_TOKEN tag push does not fire tag workflows).
# See docs/e2e/uat-agent-babysit.md and docs/promotion-contract.md
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Merge commit to tag (full SHA)
        required: true
      pr_number:
        description: Merged PR number for uat-YYMMDD-PR# tag
        required: true

concurrency:
  group: promote-uat-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  validate-inputs:
    name: Validate promote inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      promotion_status: ${{ steps.validate.outputs.promotion_status }}
      promotion_block_reason: ${{ steps.validate.outputs.promotion_block_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate commit and PR inputs
        id: validate
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          commit_sha="${INPUT_COMMIT_SHA:?}"
          pr_number="${INPUT_PR_NUMBER:?}"

          if ! git cat-file -e "${commit_sha}^{commit}" 2>/dev/null; then
            git fetch origin "${commit_sha}" --depth=1
          fi

          if ! git merge-base --is-ancestor "${commit_sha}" origin/main 2>/dev/null; then
            git fetch origin main --depth=50
          fi

          if ! git merge-base --is-ancestor "${commit_sha}" origin/main; then
            {
              echo "promotion_status=blocked"
              echo "promotion_block_reason=commit_not_on_main"
            } >> "$GITHUB_OUTPUT"
            echo "::error::commit ${commit_sha} is not on origin/main"
            exit 1
          fi

          {
            echo "commit_sha=${commit_sha}"
            echo "pr_number=${pr_number}"
            echo "promotion_status=ok"
            echo "promotion_block_reason="
          } >> "$GITHUB_OUTPUT"

      - name: Write validate summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Promote UAT — validate" \
            "workflow=promote-uat" \
            "job=validate-inputs" \
            "commit_sha=${{ steps.validate.outputs.commit_sha || inputs.commit_sha }}" \
            "pr_number=${{ steps.validate.outputs.pr_number || inputs.pr_number }}" \
            "promotion_status=${{ steps.validate.outputs.promotion_status || 'failed' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  promote-tag:
    name: Create UAT tag
    needs: validate-inputs
    if: needs.validate-inputs.outputs.promotion_status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      uat_tag: ${{ steps.promote.outputs.uat_tag }}
      promotion_status: ${{ steps.promote.outputs.promotion_status }}
      already_promoted: ${{ steps.promote.outputs.already_promoted }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-inputs.outputs.commit_sha }}
          fetch-depth: 1

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Create or verify UAT tag
        id: promote
        env:
          PR_NUMBER: ${{ needs.validate-inputs.outputs.pr_number }}
          COMMIT_SHA: ${{ needs.validate-inputs.outputs.commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-uat-tag.sh

      - name: Write promotion manifest
        env:
          COMMIT_SHA: ${{ needs.validate-inputs.outputs.commit_sha }}
          PR_NUMBER: ${{ needs.validate-inputs.outputs.pr_number }}
          UAT_TAG: ${{ steps.promote.outputs.uat_tag }}
          PROMOTION_STATUS: ${{ steps.promote.outputs.promotion_status }}
          PROMOTE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: web-build-${{ needs.validate-inputs.outputs.commit_sha }}
        run: bash scripts/ci/write-promotion-manifest.sh promotion-manifest.json

      - name: Upload promotion manifest
        uses: actions/upload-artifact@v6
        with:
          name: promotion-manifest-${{ steps.promote.outputs.uat_tag }}
          path: promotion-manifest.json
          retention-days: 90

      - name: Write promote summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Promote UAT — tag" \
            "workflow=promote-uat" \
            "job=promote-tag" \
            "commit_sha=${{ needs.validate-inputs.outputs.commit_sha }}" \
            "pr_number=${{ needs.validate-inputs.outputs.pr_number }}" \
            "uat_tag=${{ steps.promote.outputs.uat_tag || 'n/a' }}" \
            "promotion_status=${{ steps.promote.outputs.promotion_status || 'failed' }}" \
            "already_promoted=${{ steps.promote.outputs.already_promoted || 'false' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
