# Weekly k6 load smoke against localhost (advisory).
name: Performance weekly (k6)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-api-smoke:
    name: k6 API smoke (localhost)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGUSER: user
      PGPASSWORD: password
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agatha_db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install k6
        run: bash scripts/ci/install-k6-deb.sh

      - name: Start localhost stack
        run: bash scripts/ci/weekly-localhost-stack.sh

      - name: Run k6 smoke
        continue-on-error: true
        run: k6 run --summary-export=k6-summary.json e2e/perf/api-smoke.k6.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k6-smoke-summary
          path: k6-summary.json
          retention-days: 14
          if-no-files-found: ignore
