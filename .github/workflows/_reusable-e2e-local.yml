# Playwright E2E against a local stack (Postgres + Flutter web + Node server).
# Used on uat-* tag deploy (deploy-uat.yml), weekly manual/cron (e2e.yml), and PR CI canary (ci.yml).
# Full suite: thirteen parallel matrix legs (file-balanced manifest in e2e/scripts/shard-files.mjs);
# callers pass shard_total: 13 and matrix.shard [1..13] — keep in sync when changing shard count.
# PR canary: test_suite smoke-ci runs @smoke-ci only (retries 0).
# Full org journey: test_suite org-journey (ci-full-audit / manual only).
name: Reusable E2E (localhost)

on:
  workflow_call:
    inputs:
      shard_index:
        description: Playwright shard index (1-based)
        type: number
        default: 1
      shard_total:
        description: Total Playwright shards
        type: number
        default: 1
      web_artifact_name:
        description: Pre-built web artifact to download (skips Flutter build when set)
        type: string
        default: ''
      ref:
        description: Git ref to checkout before running tests (SHA or branch)
        type: string
        default: ''
      test_suite:
        description: Playwright suite — shard (file-balanced CI shard), smoke-ci (PR @smoke-ci canary), or org-journey (org IA Playwright bundle)
        type: string
        default: shard

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  e2e:
    name: >-
      ${{ inputs.test_suite == 'smoke-ci' && 'Playwright @smoke-ci canary (localhost)' || inputs.test_suite == 'org-journey' && 'Playwright org journey (localhost)' || format('Playwright E2E (localhost{0})', inputs.shard_total > 1 && format(' shard {0}/{1}', inputs.shard_index, inputs.shard_total) || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: bash scripts/ci/start-postgres-ci.sh

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            e2e/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Bootstrap database
        env:
          PGUSER: user
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: agatha_db
        run: |
          chmod +x e2e/scripts/bootstrap-db.sh
          ./e2e/scripts/bootstrap-db.sh

      - name: Download pre-built web artifact
        if: inputs.web_artifact_name != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.web_artifact_name }}
          path: .ci-web-download

      - name: Materialize web root from artifact
        if: inputs.web_artifact_name != ''
        run: |
          bash scripts/ci/materialize-web-artifact.sh \
            --source .ci-web-download \
            --artifact-name "${{ inputs.web_artifact_name }}" \
            --dest flutter_app/build/web

      - name: Set up Flutter
        if: inputs.web_artifact_name == ''
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build Flutter web
        if: inputs.web_artifact_name == ''
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Set up Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: e2e

      - name: Start server
        working-directory: server
        env:
          PGUSER: user
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: agatha_db
          E2E: '1'
        run: |
          node bin/start.js &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:3000/landing && break
            echo "Waiting for server (${attempt}/30)..."
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          if [ "${{ inputs.test_suite }}" = "smoke-ci" ]; then
            npm run test:smoke-ci
          elif [ "${{ inputs.test_suite }}" = "org-journey" ]; then
            npm run test:org-journey
          else
            npm run test:ci-shard -- ${{ inputs.shard_index }}
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            ${{ inputs.test_suite == 'smoke-ci' && 'playwright-report-localhost-smoke-ci' || inputs.test_suite == 'org-journey' && 'playwright-report-localhost-org-journey' || format('playwright-report-localhost-shard-{0}-of-{1}', inputs.shard_index, inputs.shard_total) }}
          path: e2e/playwright-report/

      - name: Write E2E job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Localhost E2E job" \
            "workflow=reusable-e2e-local" \
            "job=e2e" \
            "test_suite=${{ inputs.test_suite }}" \
            "shard=${{ inputs.shard_index }}/${{ inputs.shard_total }}" \
            "web_artifact=${{ inputs.web_artifact_name != '' && inputs.web_artifact_name || 'built-in-job' }}" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/ci/stop-postgres-ci.sh
