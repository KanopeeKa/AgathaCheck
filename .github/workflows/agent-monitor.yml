name: Agent monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to monitor
        required: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Monitor Cursor agent runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Monitor active runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          cursor_api_key: ${{ secrets.cursor_api_key }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: node .github/scripts/monitor-cursor-agent.js
