# Weekly OWASP ZAP baseline against a localhost stack (advisory).
name: Security DAST (weekly)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (localhost)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGUSER: user
      PGPASSWORD: password
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agatha_db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start localhost stack
        run: bash scripts/ci/weekly-localhost-stack.sh

      - name: ZAP baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:3000'
          cmd_options: '-a -I'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 14
          if-no-files-found: ignore
