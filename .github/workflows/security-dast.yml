# Weekly OWASP ZAP baseline against a localhost stack (advisory).
name: Security DAST (weekly)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start PostgreSQL
        run: sudo pg_ctlcluster 16 main start

      - name: Migrate and start server
        env:
          PGUSER: user
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: agatha_db
        run: |
          cd server && npm ci
          node scripts/migrate.js up
          node bin/start.js &
          n=0
          until curl -sf http://127.0.0.1:3000/backend/health; do
            n=$((n + 1))
            if [ "$n" -ge 30 ]; then exit 1; fi
            sleep 2
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:3000'
          cmd_options: '-a -I'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 14
