# Flutter analyze, format, and canonical codegen for parallel CI shards.
# Caller: ci.yml job id `flutter-analyze`.
name: Reusable Flutter analyze

on:
  workflow_call:

env:
  FLUTTER_VERSION: '3.32.0'

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter (analyze & format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: flutter_app
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner not configured; skipping codegen."
          fi

      - name: Check Dart format
        run: |
          dart format --output=none --set-exit-if-changed flutter_app/lib flutter_app/test

      - name: Sync legal documents into app assets
        run: node scripts/sync_legal_documents.js

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Stage Flutter prep artifact
        run: bash scripts/ci/stage-flutter-prep-artifact.sh

      - name: Upload Flutter prep artifact
        uses: actions/upload-artifact@v6
        with:
          name: flutter-prep-${{ github.sha }}
          path: flutter-prep-artifact.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Write analyze job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Flutter analyze job" \
            "workflow=flutter-analyze" \
            "job=analyze" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"
