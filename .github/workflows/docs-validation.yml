name: Documentation Validation

on:
  pull_request:
    paths:
      - '**.md'
      - '.cursor/**'
      - '.agents/**'
      - 'scripts/validate_docs.sh'
      - 'scripts/check_doc_placement.js'
      - 'scripts/check_docs_canonical.js'
      - 'scripts/lib/docs-canonical/**'
      - 'scripts/docs-legacy-baseline.json'
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps (js-yaml for doc placement checks)
        run: cd server && npm ci

      - name: Run documentation validation
        id: validate
        env:
          DOCS_GATE_MODE: warn
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x ./scripts/validate_docs.sh
          ./scripts/validate_docs.sh --strict
