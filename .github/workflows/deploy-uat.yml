name: Deploy UAT (uat.agathatrack.com)

on:
  push:
    branches: ['release/uat-*']
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Release branch to deploy (must exist on origin; e.g. release/uat-260715-fix2)
        required: true
      run_clean:
        description: Run flutter clean before web build (push uses UAT_FLUTTER_CLEAN repo variable)
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.32.0'
  UAT_BASE_URL: https://uat.agathatrack.com
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.ref_name }}

concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate deploy ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/assert-git-ref-exists.sh
          sparse-checkout-cone-mode: false

      - name: Verify release branch exists on origin
        run: bash scripts/ci/assert-git-ref-exists.sh "${{ env.DEPLOY_REF }}" "heads/release/uat-"

  build-web:
    name: Build Flutter web
    needs: validate-ref
    uses: ./.github/workflows/_reusable-build-web.yml
    secrets:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.ref_name }}
      run_clean: ${{ github.event_name == 'workflow_dispatch' && inputs.run_clean || github.event_name != 'workflow_dispatch' && vars.UAT_FLUTTER_CLEAN == 'true' }}
      run_codegen: true
      upload_artifact: true

  # Fast path: promote tested web artifact + FTP deploy. Unit tests already ran on main CI.
  deploy:
    name: Build and deploy to UAT
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: UAT
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record run_clean decision source
        run: |
          bash scripts/ci/append-summary.sh "UAT run_clean decision" \
            "resolved_run_clean=${{ needs.build-web.outputs.resolved_run_clean }}" \
            "source=${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch_input' || 'repo_variable' }}" \
            "source_value=${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.run_clean) || vars.UAT_FLUTTER_CLEAN || 'unset' }}"

      - name: Download built web artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-web.outputs.artifact_name }}
          path: .ci-web-download

      - name: Materialize web root for FTP deploy
        run: |
          bash scripts/ci/materialize-web-artifact.sh \
            --source .ci-web-download \
            --artifact-name "${{ needs.build-web.outputs.artifact_name }}" \
            --dest flutter_app/build/web

      - name: Deploy frontend to uat.agathatrack.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./
          local-dir: flutter_app/build/web/
          exclude: |
            **/backend/**
            # ftp-deploy often omits dotfiles from sync; never delete server copies.
            **/.htaccess
            **/.last_build_id

      - name: Stage backend for FTP (shared)
        id: stage_backend
        run: bash scripts/ci/stage-backend-deploy.sh --target uat

      - name: Deploy backend to uat.agathatrack.com/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./backend/
          local-dir: ${{ steps.stage_backend.outputs.staging_dir }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            node_modules/**
            **/test/**
            **/.dart_tool/**
            **/coverage/**
            **/*.test.js
            **/babel.config.cjs
            # cPanel generates backend/.htaccess (Passenger) — never publish or delete via FTP.
            **/.htaccess

      - name: Migration reminder
        run: |
          echo "::notice::UAT is FTP-only — apply any new SQL in server/db/migrations/ manually on UAT Postgres before running live E2E."
          echo "New migration files in this deploy:"
          ls -1 db/migrations/*.sql 2>/dev/null || true

      # ── cPanel UAPI restart (FTP-compatible, no SSH required) ────────────────
      # This calls NodeJS::restart_application via port 2083 (HTTPS), which tells
      # Passenger to pick up the newly-uploaded files. It does NOT run npm install,
      # so node_modules/ in /backend is never touched.
      #
      # Requires three UAT environment secrets (same ones used by SSH whitelist):
      #   UAT_SSH_HOST          — cPanel server hostname (e.g. server42.o2switch.net)
      #   UAT_SSH_USER          — cPanel username
      #   UAT_CPANEL_API_TOKEN  — token from cPanel → Security → Manage API Tokens
      #
      # Set UAT_CPANEL_RESTART_ENABLED=true (repo variable) to activate.
      # If the token is missing the step warns and skips — FTP deploy still succeeds.
      - name: Detect package.json changes (for conditional npm install)
        id: pkg_changed
        run: |
          # Compare against origin/main to detect package.json changes in this release branch.
          # Falls back to "false" (restart-only) on any error — safe default since npm install
          # is only needed when dependencies actually changed.
          git fetch --depth=1 origin main 2>/dev/null || true
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q '^server/package'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::server/package.json changed — cPanel npm install will run after restart."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart UAT Node.js app via cPanel UAPI (no SSH)
        id: cpanel_restart
        if: vars.UAT_CPANEL_RESTART_ENABLED == 'true'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
          APP_DOMAIN: uat.agathatrack.com
          # Only run npm install via nodevenv when package.json actually changed.
          # Never run bare `npm install` — it would create node_modules/ in /backend.
          NPM_INSTALL: ${{ steps.pkg_changed.outputs.changed }}
        run: bash scripts/cpanel-restart-app.sh

      - name: cPanel UAPI restart skipped or failed — manual reminder
        if: >-
          vars.UAT_CPANEL_RESTART_ENABLED != 'true' ||
          steps.cpanel_restart.outcome == 'failure'
        run: |
          if [ "${{ vars.UAT_CPANEL_RESTART_ENABLED }}" != "true" ]; then
            echo "::notice::UAT_CPANEL_RESTART_ENABLED not set — FTP files uploaded but app not restarted automatically."
          else
            echo "::warning::cPanel UAPI restart failed — restart app manually in cPanel → Node.js Apps."
          fi
          echo "::notice::To activate automatic restarts: set UAT_CPANEL_RESTART_ENABLED=true (repo variable)"
          echo "::notice::and ensure UAT_SSH_HOST / UAT_SSH_USER / UAT_CPANEL_API_TOKEN are in the UAT environment secrets."

      # ── Optional SSH restart (UAT_SSH_ENABLED=true) ───────────────────────────
      # SSH is blocked by o2switch's per-IP firewall. The workflow uses the
      # SshWhitelist cPanel API to temporarily open port 22 for the runner IP,
      # runs the restart, then removes the runner IP from the whitelist.
      #
      # Setup (one-time, per environment):
      #   1. cPanel → Security → Manage API Tokens → Create (name: github-actions-uat)
      #   2. GitHub → Settings → Environments → UAT → Environment secrets:
      #      UAT_SSH_HOST, UAT_SSH_USER, UAT_CPANEL_API_TOKEN, UAT_SSH_PRIVATE_KEY
      #   3. GitHub → Settings → Environments → UAT → Environment variables:
      #      UAT_SSH_ENABLED = true
      #
      # SSH adds `npm ci --omit=dev` capability but is not required for a basic restart
      # now that cPanel UAPI restart (above) handles the common case.
      - name: Verify UAT SSH + cPanel API secrets
        id: uat_ssh_config
        if: vars.UAT_SSH_ENABLED == 'true'
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
          SSH_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "$CPANEL_SERVER" ] && missing+=('UAT_SSH_HOST')
          [ -z "$CPANEL_USER" ] && missing+=('UAT_SSH_USER')
          [ -z "$CPANEL_TOKEN" ] && missing+=('UAT_CPANEL_API_TOKEN')
          [ -z "$SSH_KEY" ] && missing+=('UAT_SSH_PRIVATE_KEY')
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UAT_SSH_ENABLED=true but missing UAT environment secrets: ${missing[*]}"
            echo "::warning::Add UAT_CPANEL_API_TOKEN: cPanel → Security → Manage API Tokens → Create"
            echo "::warning::Then GitHub → Settings → Environments → UAT → Environment secrets (not repository secrets)"
            exit 0
          fi
          # Derive and print the public key so the operator can add it to cPanel if SSH auth fails.
          # This is safe: public keys are not secret.
          echo "configured=true" >> "$GITHUB_OUTPUT"
          pubkey="$(echo "$SSH_KEY" | ssh-keygen -y -f /dev/stdin 2>/dev/null || true)"
          if [ -n "$pubkey" ]; then
            echo "::notice::SSH public key (paste into cPanel → Security → SSH Access → Manage Keys → Import): ${pubkey}"
          else
            echo "::warning::Could not derive public key — ensure UAT_SSH_PRIVATE_KEY is a valid PEM/OpenSSH private key"
          fi

      - name: Get runner public IP for o2switch SSH whitelist
        id: runner_ip
        if: vars.UAT_SSH_ENABLED == 'true' && steps.uat_ssh_config.outputs.configured == 'true'
        run: |
          # haythem/public-ip@v1.3 is Node 20 and broken on Node 24 runners.
          # A plain curl to a reliable IP echo service is simpler and has no runtime dep.
          ip="$(curl -sf --retry 3 https://api.ipify.org || curl -sf --retry 3 https://ifconfig.me)"
          echo "ipv4=${ip}" >> "$GITHUB_OUTPUT"
          echo "Runner public IP: ${ip}"

      - name: o2switch SSH whitelist — clear CI slots
        id: whitelist_clear
        if: vars.UAT_SSH_ENABLED == 'true' && steps.uat_ssh_config.outputs.configured == 'true'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
        run: bash scripts/o2switch-ssh-whitelist.sh remove_all

      - name: o2switch SSH whitelist — allow GitHub runner
        id: whitelist_add
        if: >-
          vars.UAT_SSH_ENABLED == 'true' &&
          steps.uat_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_clear.outcome == 'success'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ipv4 }}
        run: bash scripts/o2switch-ssh-whitelist.sh add

      - name: o2switch SSH whitelist — verify runner IP
        id: whitelist_verify
        if: >-
          vars.UAT_SSH_ENABLED == 'true' &&
          steps.uat_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_add.outcome == 'success'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
        run: |
          bash scripts/o2switch-ssh-whitelist.sh list | grep -q "${{ steps.runner_ip.outputs.ipv4 }}"

      - name: Wait for o2switch firewall to apply
        if: >-
          vars.UAT_SSH_ENABLED == 'true' &&
          steps.uat_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_verify.outcome == 'success'
        run: sleep 30

      - name: Install dependencies & restart Node.js app (UAT SSH)
        id: uat_ssh
        if: >-
          vars.UAT_SSH_ENABLED == 'true' &&
          steps.uat_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_verify.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.UAT_SSH_PASSPHRASE }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          timeout: 120s
          script: |
            set -e
            ROOTDIR="$HOME/uat.agathatrack.com"
            APPDIR="${ROOTDIR}/backend"
            NODEVENV_BASE="$HOME/nodevenv/uat.agathatrack.com/backend"
            cd "$APPDIR"

            echo "=== SPA .htaccess at domain root ==="
            if [ -f "${ROOTDIR}/htaccess.spa" ]; then
              install -m 644 "${ROOTDIR}/htaccess.spa" "${ROOTDIR}/.htaccess"
              echo "Installed ${ROOTDIR}/.htaccess from htaccess.spa"
            elif [ -f "${ROOTDIR}/.htaccess" ]; then
              echo "OK: ${ROOTDIR}/.htaccess already present"
            else
              echo "WARNING: no htaccess.spa or .htaccess at domain root — Flutter deep links may break"
            fi

            echo "=== Passenger .htaccess in backend ==="
            if [ -f .htaccess ] && grep -qE 'Passenger(AppRoot|Enabled|BaseURI)' .htaccess 2>/dev/null; then
              echo "OK: backend/.htaccess contains Passenger directives"
            else
              echo "ERROR: backend/.htaccess missing or not a Passenger config (Apache is serving a directory listing)."
              echo "Action: cPanel -> Setup Node.js App -> app root .../backend, startup bin/start.js -> Save -> Restart"
              echo "Do not upload backend/.htaccess via FTP — cPanel generates it."
              exit 1
            fi

            echo "=== node_modules state ==="
            if [ -L node_modules ]; then
              echo "OK: node_modules is a symlink -> $(readlink -f node_modules)"
            elif [ -d node_modules ]; then
              echo "FIXING: real node_modules directory found — removing and relinking nodevenv..."
              rm -rf node_modules
              # o2switch nodevenv: ~/nodevenv/<domain>/<app-path>/<node-version>/lib/node_modules
              linked=false
              for candidate in \
                  "${NODEVENV_BASE}/22/lib/node_modules" \
                  "${NODEVENV_BASE}/22/node_modules" \
                  "${NODEVENV_BASE}/20/lib/node_modules" \
                  "${NODEVENV_BASE}/20/node_modules"; do
                if [ -d "$candidate" ]; then
                  ln -sf "$candidate" node_modules
                  echo "Linked: node_modules -> $candidate"
                  linked=true
                  break
                fi
              done
              if [ "$linked" = false ]; then
                echo "WARNING: nodevenv dir not found under ${NODEVENV_BASE}"
                echo "Action needed: cPanel -> Node.js Apps -> Run NPM Install"
              fi
            else
              echo "WARNING: node_modules does not exist — app will fail to start"
              echo "Action needed: cPanel -> Node.js Apps -> Run NPM Install"
            fi

            echo "=== env check ==="
            [ -f .env ] && echo ".env present" || echo "WARNING: .env missing — check cPanel Node.js App env vars"

            echo "=== triggering Passenger restart ==="
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Passenger restart triggered via tmp/restart.txt"

      - name: o2switch SSH whitelist — cleanup runner IP
        if: >-
          always() &&
          steps.uat_ssh_config.outputs.configured == 'true' &&
          steps.runner_ip.outcome == 'success'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.UAT_SSH_HOST }}
          CPANEL_USER: ${{ secrets.UAT_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.UAT_CPANEL_API_TOKEN }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ipv4 }}
        run: bash scripts/o2switch-ssh-whitelist.sh remove

      - name: UAT SSH whitelist or connect reminder
        if: >-
          vars.UAT_SSH_ENABLED == 'true' && (
            steps.uat_ssh_config.outputs.configured != 'true' ||
            steps.whitelist_clear.outcome == 'failure' ||
            steps.whitelist_add.outcome == 'failure' ||
            steps.whitelist_verify.outcome == 'failure' ||
            steps.uat_ssh.outcome == 'failure'
          )
        run: |
          echo "::warning::UAT SSH automation did not complete successfully."
          if [ "${{ steps.uat_ssh_config.outputs.configured }}" != "true" ]; then
            echo "::warning::Missing UAT_CPANEL_API_TOKEN and/or other UAT SSH secrets."
            echo "::warning::GitHub → Settings → Environments → UAT → Environment secrets"
            echo "::warning::cPanel → Security → Manage API Tokens → Create → paste as UAT_CPANEL_API_TOKEN"
          fi
          echo "::warning::FTP deploy succeeded — run NPM Install + Restart in cPanel if needed."

      - name: Write deploy job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "UAT deploy job" \
            "workflow=deploy-uat" \
            "job=deploy" \
            "ref=${{ env.DEPLOY_REF }}" \
            "sha=${{ needs.build-web.outputs.deploy_sha }}" \
            "artifact=${{ needs.build-web.outputs.artifact_name }}" \
            "resolved_run_clean=${{ needs.build-web.outputs.resolved_run_clean }}" \
            "run_clean_source=${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch_input' || 'repo_variable' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  # Post-deploy HTTP smoke — validates DNS, TLS, Passenger restart, API prefix.
  # Blocking gate: failures must fail prod-ready (uat-e2e-full still runs in parallel).
  smoke:
    name: UAT post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Wait for UAT to become healthy
        env:
          UAT_BASE_URL: ${{ env.UAT_BASE_URL }}
        run: bash scripts/uat-post-deploy-smoke.sh

      - name: Write smoke job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "UAT smoke job" \
            "workflow=deploy-uat" \
            "job=smoke" \
            "ref=${{ env.DEPLOY_REF }}" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  # Live UAT smoke E2E — runs in parallel with manual UAT; does not block deploy.
  uat-e2e-smoke:
    name: UAT live smoke E2E
    needs: [deploy, smoke]
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run @smoke Playwright tests against live UAT
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.UAT_BASE_URL }}
          E2E_TLS_INSECURE: '1'
          # cPanel auto-SSL on UAT is not trusted by GitHub runners (self-signed / incomplete chain).
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uat-smoke
          path: e2e/playwright-report/

      - name: Write live smoke E2E job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "UAT live smoke E2E job" \
            "workflow=deploy-uat" \
            "job=uat-e2e-smoke" \
            "ref=${{ env.DEPLOY_REF }}" \
            "sha=${{ github.sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  # Full localhost E2E — prod-readiness gate; runs in parallel with deploy.
  uat-e2e-full:
    name: UAT full E2E (localhost)
    uses: ./.github/workflows/_reusable-e2e-local.yml

  # Aggregate status for GitHub Environment protection on PROD (required check).
  prod-ready:
    name: Prod ready
    needs: [deploy, smoke, uat-e2e-smoke, uat-e2e-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify all UAT gates passed
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LIVE_SMOKE_RESULT: ${{ needs.uat-e2e-smoke.result }}
          FULL_E2E_RESULT: ${{ needs.uat-e2e-full.result }}
          DEPLOY_REF: ${{ env.DEPLOY_REF }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/assert-uat-gates.sh

  # Update GitHub issue / Project status when this deploy was triggered for an agent issue branch.
  agent-uat-notify:
    name: Notify linked agent issue
    needs: [prod-ready]
    # Job-level `if` cannot reference workflow `env`; inline the deploy ref expression.
    if: >-
      always() && (
        contains(github.ref_name, '-issue-') ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.deploy_ref, '-issue-'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update linked issue from UAT result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          HANDLER_MODE: uat-result
          BRANCH_NAME: ${{ env.DEPLOY_REF }}
          WORKFLOW_CONCLUSION: ${{ needs.prod-ready.result == 'success' && 'success' || 'failure' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/issue-agent-handlers.js
