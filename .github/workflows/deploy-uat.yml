name: Deploy UAT (uat.agathatrack.com)

on:
  push:
    branches: ['release/uat-*']
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Release branch to deploy (release/uat-*)
        required: true

env:
  FLUTTER_VERSION: '3.32.0'
  UAT_BASE_URL: https://uat.agathatrack.com
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.ref_name }}

jobs:
  # Fast path: build + FTP deploy. Unit tests already ran on main CI.
  deploy:
    name: Build and deploy to UAT
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Inject PostHog web snippet
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: bash scripts/inject_posthog_web.sh

      - name: Build Flutter Web
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          flutter clean
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=POSTHOG_API_KEY=${POSTHOG_API_KEY} \
            --dart-define=POSTHOG_HOST=https://eu.i.posthog.com

      - name: Deploy frontend to uat.agathatrack.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./
          local-dir: flutter_app/build/web/
          exclude: |
            **/backend/**

      - name: Stage migrations + restart trigger under server/
        run: |
          mkdir -p server/db server/tmp
          cp -R db/migrations server/db/migrations
          date -u +"restart %Y-%m-%dT%H:%M:%SZ" > server/tmp/restart.txt
          # CloudLinux/cPanel owns backend/node_modules as a symlink into nodevenv/.
          # Never ship a real folder from CI (stale copies break "Run NPM Install").
          rm -rf server/node_modules
          ls server/db/migrations
          cat server/tmp/restart.txt

      - name: Deploy backend to uat.agathatrack.com/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./backend/
          local-dir: server/
          exclude: |
            **/.git*
            **/.git*/**
            node_modules
            node_modules/**
            **/node_modules/**
            **/test/**
            **/.dart_tool/**
            **/coverage/**
            **/*.test.js
            **/babel.config.cjs

      - name: Migration reminder
        run: |
          echo "::notice::UAT is FTP-only — apply any new SQL in server/db/migrations/ manually on UAT Postgres before running live E2E."
          echo "New migration files in this deploy:"
          ls -1 db/migrations/*.sql 2>/dev/null || true

      # Optional: mirror prod SSH restart when repo variable UAT_SSH_ENABLED=true and UAT_SSH_* secrets are set.
      - name: Install dependencies & restart Node.js app (UAT SSH)
        if: vars.UAT_SSH_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.UAT_SSH_PASSPHRASE }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          timeout: 120s
          script: |
            set -e
            cd ~/public_html/uat.agathatrack.com/backend
            npm ci --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt

  # Post-deploy HTTP smoke — validates DNS, TLS, Passenger restart, API prefix.
  # continue-on-error: let localhost E2E finish; prod-ready is the aggregate gate.
  smoke:
    name: UAT post-deploy smoke
    needs: deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for UAT to become healthy
        env:
          UAT_BASE_URL: ${{ env.UAT_BASE_URL }}
        run: bash scripts/uat-post-deploy-smoke.sh

  # Live UAT smoke E2E — runs in parallel with manual UAT; does not block deploy.
  uat-e2e-smoke:
    name: UAT live smoke E2E
    needs: [deploy, smoke]
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run @smoke Playwright tests against live UAT
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.UAT_BASE_URL }}
          E2E_TLS_INSECURE: '1'
          # cPanel auto-SSL on UAT is not trusted by GitHub runners (self-signed / incomplete chain).
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uat-smoke
          path: e2e/playwright-report/

  # Full localhost E2E — prod-readiness gate; runs in parallel with deploy.
  uat-e2e-full:
    name: UAT full E2E (localhost)
    uses: ./.github/workflows/_reusable-e2e-local.yml

  # Aggregate status for GitHub Environment protection on PROD (required check).
  prod-ready:
    name: Prod ready
    needs: [smoke, uat-e2e-smoke, uat-e2e-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all UAT gates passed
        run: |
          smoke="${{ needs.smoke.result }}"
          live="${{ needs.uat-e2e-smoke.result }}"
          full="${{ needs.uat-e2e-full.result }}"
          echo "smoke=$smoke live_smoke_e2e=$live full_e2e=$full"
          if [ "$smoke" != "success" ] || [ "$live" != "success" ] || [ "$full" != "success" ]; then
            echo "::error::Not all UAT gates passed — do not deploy to prod."
            exit 1
          fi
          echo "All UAT gates passed. Safe to deploy commit ${{ github.sha }} to prod."

  # Update GitHub issue / Project status when this deploy was triggered for an agent issue branch.
  agent-uat-notify:
    name: Notify linked agent issue
    needs: [prod-ready]
    # Job-level `if` cannot reference workflow `env`; inline the deploy ref expression.
    if: >-
      always() && (
        contains(github.ref_name, '-issue-') ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.deploy_ref, '-issue-'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update linked issue from UAT result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECTS_PAT: ${{ secrets.GH_PROJECTS_PAT }}
          GH_PROJECT_ID: ${{ secrets.GH_PROJECT_ID }}
          GH_STATUS_FIELD_ID: ${{ secrets.GH_STATUS_FIELD_ID }}
          HANDLER_MODE: uat-result
          BRANCH_NAME: ${{ env.DEPLOY_REF }}
          WORKFLOW_CONCLUSION: ${{ needs.prod-ready.result == 'success' && 'success' || 'failure' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/issue-agent-handlers.js
