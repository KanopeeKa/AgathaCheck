name: Deploy UAT (uat.agathatrack.com)

on:
  push:
    branches: [ 'release/uat-*' ]

env:
  # Single source of truth for the Flutter SDK version across all jobs in
  # this workflow. Pinned to match local dev and the main CI workflow.
  # Flutter 3.41 has a regression where flutter_tester segfaults during
  # test cleanup on Linux. Bumping this value also busts the dependency
  # cache (key includes ${FLUTTER_VERSION}), so stale .dart_tool artifacts
  # from a different SDK won't be restored.
  FLUTTER_VERSION: '3.32.0'

jobs:
  test:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        # Mirror main CI: tolerate warnings/infos, fail only on errors.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        working-directory: flutter_app
        # Mirror main CI: --coverage omitted (causes flutter_tester segfault
        # on Linux during teardown); integration tests excluded here and run
        # separately in main CI with continue-on-error.
        run: flutter test --concurrency=1 --exclude-tags=integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run backend tests
        working-directory: server
        run: npx jest --env=node --forceExit

  deploy:
    name: Build and deploy to UAT
    needs: test
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - uses: actions/checkout@v4

      # ===== BUILD FRONTEND =====
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Build Flutter Web
        working-directory: flutter_app
        run: |
          flutter clean
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      # ===== DEPLOY FRONTEND (Flutter Web) =====
      - name: Deploy frontend to uat.agathatrack.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./
          local-dir: flutter_app/build/web/
          # Don't wipe the backend folder when refreshing the frontend.
          exclude: |
            **/backend/**

      # ===== DEPLOY BACKEND (Node.js) =====
      # Excludes node_modules, tests, and dev configs. The remote `npm install`
      # / restart step below reinstalls dependencies on the server.
      - name: Deploy backend to uat.agathatrack.com/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.UAT_FTP_SERVER }}
          username: ${{ secrets.UAT_FTP_USERNAME }}
          password: ${{ secrets.UAT_FTP_PASSWORD }}
          server-dir: ./backend/
          local-dir: server/
          exclude: |
            **/node_modules/**
            **/test/**
            **/.dart_tool/**
            **/coverage/**
            **/*.test.js
            **/babel.config.cjs

      # ===== INSTALL DEPENDENCIES & RESTART NODE.JS APP =====
      # Required so the freshly-deployed backend has its node_modules and the
      # Passenger / cPanel Node.js app picks up the new code.
      - name: Install dependencies & restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          timeout: 60s
          script: |
            cd ~/public_html/uat.agathatrack.com/backend
            npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt