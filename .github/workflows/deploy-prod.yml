name: Deploy Production (agathatrack.com)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref validated on UAT (commit SHA, tag, or branch)'
        required: true
  release:
    types: [published]

env:
  FLUTTER_VERSION: '3.32.0'
  PROD_BASE_URL: https://agathatrack.com

jobs:
  deploy:
    name: Build and deploy to Production
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Inject PostHog web snippet
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: bash scripts/inject_posthog_web.sh

      - name: Build Flutter Web
        working-directory: flutter_app
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          flutter clean
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=POSTHOG_API_KEY=${POSTHOG_API_KEY} \
            --dart-define=POSTHOG_HOST=https://eu.i.posthog.com

      - name: Deploy frontend to agathatrack.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          server-dir: /public_html/Prod/
          local-dir: ./flutter_app/build/web/
          exclude: |
            **/backend/**

      - name: Stage db migrations under server/
        run: |
          mkdir -p server/db
          cp -R db/migrations server/db/migrations
          rm -rf server/node_modules
          ls server/db/migrations

      - name: Deploy backend to agathatrack.com/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          server-dir: /public_html/Prod/backend/
          local-dir: server/
          exclude: |
            **/.git*
            **/.git*/**
            node_modules
            node_modules/**
            **/node_modules/**
            **/test/**
            **/.dart_tool/**
            **/coverage/**
            **/*.test.js
            **/babel.config.cjs

      - name: Install dependencies & restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          timeout: 60s
          script: |
            set -e
            cd ~/public_html/Prod/backend
            npm ci --omit=dev
            node scripts/migrate.js up
            mkdir -p tmp
            touch tmp/restart.txt

  smoke:
    name: Production post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production to become healthy
        run: |
          set -e
          for i in $(seq 1 12); do
            if curl -sf "${PROD_BASE_URL}/backend/health" | grep -q '"status":"OK"'; then
              echo "Backend healthy after attempt $i"
              break
            fi
            echo "Waiting for Passenger restart ($i/12)..."
            sleep 10
          done
          curl -sf "${PROD_BASE_URL}/backend/health"
          curl -sf "${PROD_BASE_URL}/landing" -o /dev/null

  # Future: add @smoke Playwright against PROD_BASE_URL once a dedicated smoke
  # test account or cleanup strategy is in place (live signup pollutes prod DB).
