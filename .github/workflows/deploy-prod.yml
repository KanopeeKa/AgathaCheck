name: Deploy Production (agathatrack.com)

on:
  # Prod promotion is dispatched explicitly from deploy-uat.yml only when Prod ready is green.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref validated on UAT (commit SHA, tag, or branch)'
        required: true
      uat_run_id:
        description: UAT workflow run ID with green Prod ready (recommended)
        required: false
      rebuild_if_missing:
        description: Rebuild web if promoted artifact is missing/expired (audited fallback)
        type: boolean
        default: false
  release:
    types: [published]

env:
  FLUTTER_VERSION: '3.32.0'
  PROD_BASE_URL: https://agathatrack.com

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve-trigger:
    name: Resolve promotion trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      uat_run_id: ${{ steps.resolve.outputs.uat_run_id }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      trigger_source: ${{ steps.resolve.outputs.trigger_source }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Always run trigger validation from main so dispatch cannot bypass guards
          # by pointing inputs.ref at an older tag/branch missing this script.
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/resolve-prod-trigger.sh
            scripts/ci/append-summary.sh
          sparse-checkout-cone-mode: false

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve trigger context
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          DISPATCH_UAT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.uat_run_id || '' }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/resolve-prod-trigger.sh

      - name: Write resolve summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Deploy PROD — resolve trigger" \
            "workflow=deploy-prod" \
            "job=resolve-trigger" \
            "trigger_source=${{ steps.resolve.outputs.trigger_source || github.event_name }}" \
            "proceed=${{ steps.resolve.outputs.proceed || 'false' }}" \
            "commit_sha=${{ steps.resolve.outputs.commit_sha || 'n/a' }}" \
            "uat_run_id=${{ steps.resolve.outputs.uat_run_id || 'n/a' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  gate-prod-deploy:
    name: Evaluate PROD deploy gate
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prod_deploy_enabled: ${{ steps.gate.outputs.prod_deploy_enabled }}
      skip_deploy: ${{ steps.gate.outputs.skip_deploy }}
    steps:
      - name: Evaluate PROD_DEPLOY_ENABLED
        id: gate
        run: |
          enabled=false
          skip_deploy=true
          if [ "${{ vars.PROD_DEPLOY_ENABLED }}" = "true" ]; then
            enabled=true
            skip_deploy=false
          fi
          {
            echo "prod_deploy_enabled=${enabled}"
            echo "skip_deploy=${skip_deploy}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy to Production
    needs: [resolve-trigger, gate-prod-deploy]
    if: >-
      needs.resolve-trigger.outputs.proceed == 'true' &&
      needs.gate-prod-deploy.outputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: PROD
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-trigger.outputs.target_ref }}

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve deployment commit SHA
        id: deploy_sha
        run: |
          sha="${{ needs.resolve-trigger.outputs.commit_sha }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "target_ref=${{ needs.resolve-trigger.outputs.target_ref }}" >> "$GITHUB_OUTPUT"

      - name: Download promoted UAT web artifact
        id: promote
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UAT_RUN_ID: ${{ needs.resolve-trigger.outputs.uat_run_id }}
        run: |
          set -euo pipefail
          args=(--sha "${{ steps.deploy_sha.outputs.sha }}")
          if [[ -n "${UAT_RUN_ID}" ]]; then
            args+=(--uat-run-id "${UAT_RUN_ID}")
          fi
          bash scripts/ci/download-uat-artifact.sh "${args[@]}"

      - name: Set up Flutter
        if: >-
          steps.promote.outcome == 'failure' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_if_missing == true
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        if: >-
          steps.promote.outcome == 'failure' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_if_missing == true
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Rebuild web (non-promoted fallback)
        if: >-
          steps.promote.outcome == 'failure' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_if_missing == true
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          RUN_CLEAN: 'true'
          RUN_CODEGEN: 'true'
          ARTIFACT_NAME: web-build-${{ steps.deploy_sha.outputs.sha }}
          SOURCE_WORKFLOW: deploy-prod-rebuild
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          echo "::warning::NON-PROMOTED REBUILD PATH USED — promoted UAT artifact was unavailable"
          bash scripts/ci/build-flutter-web.sh
          bash scripts/ci/append-summary.sh "PROD frontend source" \
            "promotion_path=non-promoted-rebuild" \
            "deploy_sha=${{ steps.deploy_sha.outputs.sha }}" \
            "run_id=${{ github.run_id }}"

      - name: Fail closed when promotion unavailable
        if: >-
          steps.promote.outcome == 'failure' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.rebuild_if_missing != true
          )
        run: |
          echo "::error::Promoted UAT artifact unavailable for ${{ steps.deploy_sha.outputs.sha }}."
          echo "::error::Auto-promotion and release publishes require a promoted artifact. Use workflow_dispatch with uat_run_id or rebuild_if_missing=true only as an audited override."
          exit 1

      - name: Record promoted frontend source
        if: steps.promote.outcome == 'success'
        run: |
          bash scripts/ci/append-summary.sh "PROD frontend source" \
            "promotion_path=promoted" \
            "deploy_sha=${{ steps.deploy_sha.outputs.sha }}" \
            "artifact_name=${{ steps.promote.outputs.artifact_name }}" \
            "uat_run_id=${{ steps.promote.outputs.uat_run_id }}" \
            "run_id=${{ github.run_id }}"

      - name: Deploy frontend to agathatrack.com
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          server-dir: agathatrack.com/
          local-dir: ./flutter_app/build/web/
          exclude: |
            **/backend/**
            **/.htaccess
            **/.last_build_id

      - name: Stage backend for FTP (shared)
        id: stage_backend
        run: bash scripts/ci/stage-backend-deploy.sh --target prod

      - name: Deploy backend to agathatrack.com/backend/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          server-dir: agathatrack.com/backend/
          local-dir: ${{ steps.stage_backend.outputs.staging_dir }}/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            node_modules
            **/node_modules
            **/node_modules/**
            node_modules/**
            .env
            **/.env
            **/test/**
            **/.dart_tool/**
            **/coverage/**
            **/*.test.js
            **/babel.config.cjs
            **/.htaccess

      - name: Detect package.json changes (for conditional npm install)
        id: pkg_changed
        run: |
          git fetch --depth=1 origin main 2>/dev/null || true
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q '^server/package'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependencies changed::server/package.json or package-lock.json changed — manual cPanel Run NPM Install required after deploy."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── o2switch SSH whitelist (PROD_SSH_PORT, default 22) ───────────────────
      # GitHub runner IPs are blocked until whitelisted via cPanel SshWhitelist API.
      # Requires PROD_CPANEL_API_TOKEN in the PROD environment (same host/user as SSH).
      - name: Verify PROD SSH + cPanel API secrets
        id: prod_ssh_config
        env:
          CPANEL_SERVER: ${{ secrets.PROD_SSH_HOST }}
          CPANEL_USER: ${{ secrets.PROD_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "$CPANEL_SERVER" ] && missing+=('PROD_SSH_HOST')
          [ -z "$CPANEL_USER" ] && missing+=('PROD_SSH_USER')
          [ -z "$CPANEL_TOKEN" ] && missing+=('PROD_CPANEL_API_TOKEN')
          [ -z "$SSH_KEY" ] && missing+=('PROD_SSH_PRIVATE_KEY')
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing PROD environment secrets: ${missing[*]}"
            echo "::error::Add PROD_CPANEL_API_TOKEN: cPanel → Security → Manage API Tokens → Create"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          pubkey="$(echo "$SSH_KEY" | ssh-keygen -y -f /dev/stdin 2>/dev/null || true)"
          if [ -n "$pubkey" ]; then
            echo "::notice::SSH public key (cPanel → SSH Access → Manage Keys): ${pubkey}"
          fi

      - name: Get runner public IP for o2switch SSH whitelist
        id: runner_ip
        if: steps.prod_ssh_config.outputs.configured == 'true'
        run: bash scripts/ci/get-runner-public-ipv4.sh

      - name: o2switch SSH whitelist — clear CI slots
        id: whitelist_clear
        if: steps.prod_ssh_config.outputs.configured == 'true'
        env:
          CPANEL_SERVER: ${{ secrets.PROD_SSH_HOST }}
          CPANEL_USER: ${{ secrets.PROD_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
        run: bash scripts/o2switch-ssh-whitelist.sh remove_all

      - name: o2switch SSH whitelist — allow GitHub runner
        id: whitelist_add
        if: >-
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_clear.outcome == 'success'
        env:
          CPANEL_SERVER: ${{ secrets.PROD_SSH_HOST }}
          CPANEL_USER: ${{ secrets.PROD_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ipv4 }}
        run: bash scripts/o2switch-ssh-whitelist.sh add

      - name: o2switch SSH whitelist — verify runner IP
        id: whitelist_verify
        if: >-
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_add.outcome == 'success'
        env:
          CPANEL_SERVER: ${{ secrets.PROD_SSH_HOST }}
          CPANEL_USER: ${{ secrets.PROD_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
        run: |
          bash scripts/o2switch-ssh-whitelist.sh list | grep -q "${{ steps.runner_ip.outputs.ipv4 }}"

      - name: Wait for o2switch firewall to apply
        if: >-
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_verify.outcome == 'success'
        run: sleep 30

      - name: Prepare PROD SSH remote bundle
        if: >-
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_verify.outcome == 'success'
        run: bash scripts/ci/prepare-prod-ssh-remote.sh

      # script_path requires appleboy/ssh-action >= v1.2.0 — pin full SHA (v1.0.x silently no-ops).
      - name: PROD backend deploy via SSH
        id: prod_ssh
        if: >-
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.whitelist_verify.outcome == 'success'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          PKG_CHANGED: ${{ steps.pkg_changed.outputs.changed }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          timeout: 180s
          command_timeout: 10m
          script_path: .ci-prod-ssh-remote.sh
          envs: PKG_CHANGED

      - name: o2switch SSH whitelist — cleanup runner IP
        if: >-
          always() &&
          steps.prod_ssh_config.outputs.configured == 'true' &&
          steps.runner_ip.outcome == 'success'
        continue-on-error: true
        env:
          CPANEL_SERVER: ${{ secrets.PROD_SSH_HOST }}
          CPANEL_USER: ${{ secrets.PROD_SSH_USER }}
          CPANEL_TOKEN: ${{ secrets.PROD_CPANEL_API_TOKEN }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.ipv4 }}
        run: bash scripts/o2switch-ssh-whitelist.sh remove

      - name: Write deploy job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Production deploy job" \
            "workflow=deploy-prod" \
            "job=deploy" \
            "ref=${{ steps.deploy_sha.outputs.target_ref }}" \
            "sha=${{ steps.deploy_sha.outputs.sha }}" \
            "promotion_path=${{ steps.promote.outcome == 'success' && 'promoted' || 'rebuild-or-failed' }}" \
            "artifact_name=${{ steps.promote.outputs.artifact_name || format('web-build-{0}', steps.deploy_sha.outputs.sha) }}" \
            "uat_run_id=${{ steps.promote.outputs.uat_run_id || needs.resolve-trigger.outputs.uat_run_id || '' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  deploy-skipped-stub:
    name: Production deploy skipped (intentional)
    needs: [resolve-trigger, gate-prod-deploy]
    if: >-
      needs.resolve-trigger.outputs.proceed == 'true' &&
      needs.gate-prod-deploy.outputs.skip_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record intentional prod deploy skip
        run: |
          {
            echo "## Production deploy skipped (intentional)"
            echo
            echo "Prod deployment skipped intentionally (\`PROD_DEPLOY_ENABLED\` is not \`true\`)."
            echo "No FTP/SSH steps ran."
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| commit_sha | \`${{ needs.resolve-trigger.outputs.commit_sha }}\` |"
            echo "| uat_run_id | \`${{ needs.resolve-trigger.outputs.uat_run_id || 'n/a' }}\` |"
            echo "| trigger | \`${{ needs.resolve-trigger.outputs.trigger_source }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-release-tag:
    name: Create production release tag
    needs: [resolve-trigger, gate-prod-deploy, deploy, deploy-skipped-stub]
    if: >-
      always() &&
      needs.resolve-trigger.outputs.proceed == 'true' &&
      (
        needs.deploy.result == 'success' ||
        needs.deploy-skipped-stub.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      prod_tag: ${{ steps.promote.outputs.prod_tag }}
      promotion_status: ${{ steps.promote.outputs.promotion_status }}
      already_released: ${{ steps.promote.outputs.already_released }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-trigger.outputs.commit_sha }}
          fetch-depth: 1

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve production semver tag
        id: semver
        env:
          COMMIT_SHA: ${{ needs.resolve-trigger.outputs.commit_sha }}
          PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
        run: bash scripts/ci/resolve-prod-semver.sh

      - name: Create or verify production tag
        id: promote
        env:
          PROD_TAG: ${{ steps.semver.outputs.prod_tag }}
          COMMIT_SHA: ${{ needs.resolve-trigger.outputs.commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-prod-tag.sh

      - name: Write promote summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Deploy PROD — release tag" \
            "workflow=deploy-prod" \
            "job=promote-release-tag" \
            "commit_sha=${{ needs.resolve-trigger.outputs.commit_sha }}" \
            "prod_tag=${{ steps.promote.outputs.prod_tag || steps.semver.outputs.prod_tag || 'n/a' }}" \
            "tag_kind=${{ steps.semver.outputs.tag_kind || 'n/a' }}" \
            "promotion_status=${{ steps.promote.outputs.promotion_status || 'failed' }}" \
            "already_released=${{ steps.promote.outputs.already_released || 'false' }}" \
            "prod_deploy_enabled=${{ needs.gate-prod-deploy.outputs.prod_deploy_enabled }}" \
            "uat_run_id=${{ needs.resolve-trigger.outputs.uat_run_id || 'n/a' }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  smoke:
    name: Production post-deploy smoke
    needs: [resolve-trigger, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Begin job timing
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Wait for production to become healthy
        run: |
          set -e
          for attempt in $(seq 1 12); do
            if curl -sf "${PROD_BASE_URL}/backend/health" | grep -q '"status":"OK"'; then
              echo "Backend healthy after attempt ${attempt}"
              break
            fi
            echo "Waiting for Passenger restart (${attempt}/12)..."
            sleep 10
          done
          curl -sf "${PROD_BASE_URL}/backend/health"
          curl -sf "${PROD_BASE_URL}/landing" -o /dev/null

      - name: Write smoke job summary
        if: always()
        run: |
          end=$(date +%s)
          start="${JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          bash scripts/ci/append-summary.sh "Production smoke job" \
            "workflow=deploy-prod" \
            "job=smoke" \
            "sha=${{ needs.resolve-trigger.outputs.commit_sha }}" \
            "run_id=${{ github.run_id }}" \
            "duration_sec=${dur}"

  # Future: add @smoke Playwright against PROD_BASE_URL once a dedicated smoke
  # test account or cleanup strategy is in place (live signup pollutes prod DB).
