name: E2E (Playwright)

# Full localhost E2E is intentionally NOT run on every PR commit (too slow).
# It runs on UAT CD (deploy-uat.yml → uat-e2e-full, six shards), weekly on main (non-blocking),
# and can be triggered manually.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

# Weekly cron runs cancel superseded schedule runs; manual dispatches do not
# cancel each other (separate concurrency groups).
concurrency:
  group: >-
    ${{
      github.event_name == 'schedule' && 'e2e-schedule-main' ||
      format('e2e-manual-{0}', github.ref)
    }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  # Playwright --shard count; matrix.shard must list 1..E2E_SHARD_TOTAL (keep in sync with deploy-uat.yml).
  E2E_SHARD_TOTAL: '6'

permissions:
  contents: read

jobs:
  build-web:
    uses: ./.github/workflows/_reusable-build-web.yml

  e2e:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    uses: ./.github/workflows/_reusable-e2e-local.yml
    with:
      shard_index: ${{ matrix.shard }}
      shard_total: ${{ fromJSON(env.E2E_SHARD_TOTAL) }}
      web_artifact_name: ${{ needs.build-web.outputs.artifact_name }}

  # Weekly signal only — does not block merges to main.
  notify-on-failure:
    if: failure() && github.event_name == 'schedule'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Weekly E2E failed
        run: |
          echo "::warning::Weekly non-blocking E2E on main failed. Check the workflow run and fix before the next UAT release."
